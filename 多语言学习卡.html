</head>
<body>
    <div class="app" id="app">
        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- 头部 -->
        <header class="header">
            <div class="header-left">
                <h1>📚 多语言学习卡</h1>
                <span class="badge" id="langCountBadge">0 种语言</span>
            </div>
            <div class="header-actions">
                <span class="stat" id="entryCountStat">0 个词条</span>
                <button class="btn btn-primary" id="uploadBtn">📤 上传 Excel</button>
                <button class="btn btn-success" id="exportBtn">📥 导出数据</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
            </div>
        </header>

        <!-- 上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <span class="icon">📁</span>
            <h3>拖拽 Excel 文件到此处</h3>
            <div class="desc">
                <span>支持 <strong>.xlsx</strong> / <strong>.xls</strong></span>
                <span class="divider">|</span>
                <span>点击上方「上传 Excel」按钮</span>
            </div>
            <div class="hint">页面启动时会自动尝试加载同目录下的 <strong>common.json</strong></div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar" id="toolbar" style="display:none;">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索词汇或句子..." autocomplete="off" />
            </div>

            <!-- 语种选择 -->
            <div style="position:relative; flex-shrink:0;">
                <div class="lang-selector-btn" id="langSelectorBtn">
                    <span>🌐 语种</span>
                    <span class="badge-count" id="langBadgeCount">全部</span>
                    <span class="arrow" id="langArrow">▾</span>
                </div>
                <div class="lang-panel" id="langPanel">
                    <div class="panel-header">
                        <div></div>
                        <div class="panel-actions">
                            <button class="btn btn-sm" id="selectAllLang">全选</button>
                            <button class="btn btn-sm" id="deselectAllLang">取消全选</button>
                        </div>
                    </div>
                    <div class="lang-grid" id="langGrid"></div>
                    <div class="panel-footer">
                        <button class="btn btn-primary" id="langPanelConfirm">确定</button>
                    </div>
                </div>
            </div>

            <!-- 模式切换 -->
            <div class="mode-switch" id="modeSwitch">
                <button class="btn active" data-mode="vocabulary">📖 词汇</button>
                <button class="btn" data-mode="sentence">💬 句子</button>
            </div>

            <!-- 显示模式 -->
            <div class="display-switch" id="displaySwitch">
                <button class="btn" data-display="single">单栏</button>
                <button class="btn active" data-display="dual">双栏</button>
            </div>
        </div>

        <!-- 卡片网格 -->
        <div id="cardGrid" class="card-grid"></div>

        <!-- 分页控件 -->
        <div class="pagination-wrapper" id="paginationWrapper" style="display:none;">
            <button class="p-btn" id="firstPage">⏮ 首页</button>
            <button class="p-btn" id="prevPage">◀ 上一页</button>
            <span class="page-info">
                第 <input type="number" class="page-input" id="pageInput" min="1" value="1" /> 页 / 共 <span id="totalPages">0</span> 页
            </span>
            <button class="p-btn" id="nextPage">下一页 ▶</button>
            <button class="p-btn" id="lastPage">末页 ⏭</button>
            <span class="page-info">
                每页
                <select class="page-size-select" id="pageSizeSelect">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
                张
            </span>
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display:none;">
            <span class="big-icon">🔎</span>
            <h3 id="emptyTitle">未找到匹配的词汇</h3>
            <p id="emptyDesc">试试调整搜索关键词或筛选条件</p>
        </div>

        <!-- 例句模态框 -->
        <div class="modal-overlay" id="sentenceModal">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">📖 例句</h2>
                    <button class="modal-close" id="modalClose">✕</button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM ----------
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const fileInput = $('#fileInput');
            const uploadZone = $('#uploadZone');
            const uploadBtn = $('#uploadBtn');
            const exportBtn = $('#exportBtn');
            const searchInput = $('#searchInput');
            const cardGrid = $('#cardGrid');
            const emptyState = $('#emptyState');
            const emptyTitle = $('#emptyTitle');
            const emptyDesc = $('#emptyDesc');
            const toolbar = $('#toolbar');
            const langCountBadge = $('#langCountBadge');
            const entryCountStat = $('#entryCountStat');
            const paginationWrapper = $('#paginationWrapper');
            const firstPageBtn = $('#firstPage');
            const prevPageBtn = $('#prevPage');
            const nextPageBtn = $('#nextPage');
            const lastPageBtn = $('#lastPage');
            const pageInput = $('#pageInput');
            const totalPagesSpan = $('#totalPages');
            const pageSizeSelect = $('#pageSizeSelect');
            const toastEl = $('#toast');

            const modalOverlay = $('#sentenceModal');
            const modalClose = $('#modalClose');
            const modalTitle = $('#modalTitle');
            const modalBody = $('#modalBody');

            const langSelectorBtn = $('#langSelectorBtn');
            const langPanel = $('#langPanel');
            const langGrid = $('#langGrid');
            const langBadgeCount = $('#langBadgeCount');
            const langArrow = $('#langArrow');
            const selectAllLang = $('#selectAllLang');
            const deselectAllLang = $('#deselectAllLang');
            const langPanelConfirm = $('#langPanelConfirm');

            const modeSwitch = $('#modeSwitch');
            const displaySwitch = $('#displaySwitch');

            // ---------- 全局状态 ----------
            let vocabulary = [];
            let languages = [];
            let foreignLangs = [];
            let hanLangs = [];
            let mandarinIndex = -1;

            let sentences = [];
            let sentenceLanguages = [];
            let sentenceForeignLangs = [];
            let sentenceHanLangs = [];
            let sentenceMandarinIndex = -1;

            let allDataLoaded = false;
            let selectedLangs = [];
            let currentMode = 'vocabulary';
            let displayMode = 'dual';
            let currentPage = 1;
            let pageSize = 1;
            let toastTimer = null;
            let isLangPanelOpen = false;

            const langColors = [
                '#2563eb', '#7c3aed', '#0ea5e9', '#14b8a6', '#8b5cf6',
                '#f59e0b', '#ef4444', '#ec4899', '#06b6d4', '#84cc16',
                '#f97316', '#6366f1', '#22d3ee', '#a855f7', '#10b981'
            ];

            function getLangColor(idx) {
                return langColors[idx % langColors.length];
            }

            // ---------- Toast ----------
            function showToast(message, type) {
                if (toastTimer) { clearTimeout(toastTimer);
                    toastTimer = null; }
                toastEl.textContent = message;
                toastEl.className = 'toast';
                if (type) toastEl.classList.add(type);
                toastEl.classList.add('show');
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                    toastTimer = null;
                }, 2800);
            }

            // ---------- 工具 ----------
            function splitMultiExpressions(cell) {
                if (!cell) return [];
                return String(cell).split(',').map(s => s.trim()).filter(Boolean);
            }

            function getCurrentLangList() {
                return currentMode === 'vocabulary' ? languages : sentenceLanguages;
            }

            function getCurrentForeignLangs() {
                return currentMode === 'vocabulary' ? foreignLangs : sentenceForeignLangs;
            }

            function getCurrentHanLangs() {
                return currentMode === 'vocabulary' ? hanLangs : sentenceHanLangs;
            }

            function getCurrentData() {
                return currentMode === 'vocabulary' ? vocabulary : sentences;
            }

            // ---------- 加载 Excel ----------
            function loadExcelFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        const vocabSheet = workbook.Sheets[workbook.SheetNames[0]];
                        if (!vocabSheet) { showToast('未找到第一个 sheet (词汇)', 'error'); return; }
                        const vocabRows = XLSX.utils.sheet_to_json(vocabSheet, { header: 1, defval: '' });
                        if (vocabRows.length < 2) { showToast('词汇表数据不足', 'error'); return; }

                        const headers = vocabRows[0].map(h => String(h).trim());

                        const langColumns = [];
                        const pronColumns = [];
                        const noteColumns = [];
                        let mandarinIdx = -1;
                        headers.forEach((h, idx) => {
                            if (h === '发音') {
                                pronColumns.push(idx);
                            } else if (h.includes('备注')) {
                                noteColumns.push({ idx, name: h });
                            } else if (h) {
                                langColumns.push({ idx, lang: h });
                                if (h === '普通话') mandarinIdx = idx;
                            }
                        });

                        if (mandarinIdx === -1) {
                            showToast('未找到「普通话」列，无法分类', 'error');
                            return;
                        }
                        mandarinIndex = mandarinIdx;

                        foreignLangs = [];
                        hanLangs = [];
                        langColumns.forEach(({ idx, lang }) => {
                            if (idx < mandarinIdx) foreignLangs.push(lang);
                            else hanLangs.push(lang);
                        });
                        languages = langColumns.map(item => item.lang);

                        const langPronMap = {};
                        const langNoteMap = {};
                        langColumns.forEach(({ idx, lang }) => {
                            let pronIdx = -1;
                            for (const pIdx of pronColumns) {
                                if (pIdx > idx) { pronIdx = pIdx; break; }
                            }
                            langPronMap[lang] = pronIdx;
                        });
                        noteColumns.forEach(({ idx: noteIdx, name }) => {
                            let matchedLang = null;
                            let maxLangIdx = -1;
                            for (const { idx: langIdx, lang } of langColumns) {
                                if (langIdx < noteIdx && langIdx > maxLangIdx) {
                                    maxLangIdx = langIdx;
                                    matchedLang = lang;
                                }
                            }
                            if (matchedLang) {
                                langNoteMap[matchedLang] = noteIdx;
                            }
                        });

                        const entries = [];
                        for (let r = 1; r < vocabRows.length; r++) {
                            const row = vocabRows[r];
                            if (!row || row.every(cell => String(cell).trim() === '')) continue;

                            const words = {};
                            let hasData = false;
                            langColumns.forEach(({ idx, lang }) => {
                                const text = row[idx] !== undefined ? String(row[idx]).trim() : '';
                                const pronIdx = langPronMap[lang];
                                const pron = pronIdx !== -1 && row[pronIdx] !== undefined ? String(row[
                                    pronIdx]).trim() : '';
                                const noteIdx = langNoteMap[lang];
                                const note = noteIdx !== undefined && row[noteIdx] !== undefined ? String(
                                    row[noteIdx]).trim() : '';

                                if (text || pron || note) hasData = true;
                                words[lang] = { text, pronunciation: pron, note };
                            });

                            if (!hasData) continue;
                            entries.push({ id: entries.length, words });
                        }

                        if (entries.length === 0) { showToast('词汇表没有有效数据', 'error'); return; }
                        vocabulary = entries;

                        // ---- 句子表 (Sheet 1) ----
                        sentences = [];
                        sentenceLanguages = [];
                        sentenceForeignLangs = [];
                        sentenceHanLangs = [];
                        sentenceMandarinIndex = -1;

                        if (workbook.SheetNames.length > 1) {
                            const sentSheet = workbook.SheetNames[1];
                            const sentRows = XLSX.utils.sheet_to_json(workbook.Sheets[sentSheet], { header: 1,
                                    defval: '' });
                            if (sentRows.length > 1) {
                                const sentHeaders = sentRows[0].map(h => String(h).trim());

                                const sentLangColumns = [];
                                const sentPronColumns = [];
                                const sentNoteColumns = [];
                                let sentMandarinIdx = -1;

                                sentHeaders.forEach((h, idx) => {
                                    if (h === '发音') {
                                        sentPronColumns.push(idx);
                                    } else if (h.includes('备注')) {
                                        sentNoteColumns.push({ idx, name: h });
                                    } else if (h) {
                                        sentLangColumns.push({ idx, lang: h });
                                        if (h === '普通话') sentMandarinIdx = idx;
                                    }
                                });

                                sentenceMandarinIndex = sentMandarinIdx;
                                sentenceLanguages = sentLangColumns.map(item => item.lang);

                                if (sentMandarinIdx !== -1) {
                                    sentLangColumns.forEach(({ idx, lang }) => {
                                        if (idx < sentMandarinIdx) sentenceForeignLangs.push(lang);
                                        else sentenceHanLangs.push(lang);
                                    });
                                } else {
                                    sentenceHanLangs = [...sentenceLanguages];
                                }

                                const sentLangPronMap = {};
                                const sentLangNoteMap = {};
                                sentLangColumns.forEach(({ idx, lang }) => {
                                    let pronIdx = -1;
                                    for (const pIdx of sentPronColumns) {
                                        if (pIdx > idx) { pronIdx = pIdx; break; }
                                    }
                                    sentLangPronMap[lang] = pronIdx;
                                });
                                sentNoteColumns.forEach(({ idx: noteIdx, name }) => {
                                    let matchedLang = null;
                                    let maxLangIdx = -1;
                                    for (const { idx: langIdx, lang } of sentLangColumns) {
                                        if (langIdx < noteIdx && langIdx > maxLangIdx) {
                                            maxLangIdx = langIdx;
                                            matchedLang = lang;
                                        }
                                    }
                                    if (matchedLang) {
                                        sentLangNoteMap[matchedLang] = noteIdx;
                                    }
                                });

                                for (let r = 1; r < sentRows.length; r++) {
                                    const row = sentRows[r];
                                    if (!row || row.every(c => String(c).trim() === '')) continue;
                                    const texts = {};
                                    let hasData = false;
                                    sentLangColumns.forEach(({ idx, lang }) => {
                                        const text = row[idx] !== undefined ? String(row[idx]).trim() :
                                        '';
                                        const pronIdx = sentLangPronMap[lang];
                                        const pron = pronIdx !== -1 && row[pronIdx] !== undefined ? String(
                                            row[pronIdx]).trim() : '';
                                        const noteIdx = sentLangNoteMap[lang];
                                        const note = noteIdx !== undefined && row[noteIdx] !== undefined ?
                                            String(row[noteIdx]).trim() : '';
                                        if (text || pron || note) hasData = true;
                                        texts[lang] = { text, pronunciation: pron, note };
                                    });
                                    if (!hasData) continue;
                                    sentences.push({ id: sentences.length, texts });
                                }
                            }
                        }

                        allDataLoaded = true;
                        currentPage = 1;
                        selectedLangs = [];
                        renderAll();
                        showToolbar(true);
                        uploadZone.style.display = 'none';
                        updateStats();
                        showToast(`✅ 成功加载 ${vocabulary.length} 个词条，${sentences.length} 个句子`, 'success');

                    } catch (err) {
                        console.error(err);
                        showToast('解析 Excel 失败: ' + err.message, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            // ---------- 自动加载（优先 common.json） ----------
            function autoLoadDataFile() {
                const fileName = 'common.json';
                fetch(fileName)
                    .then(res => {
                        if (!res.ok) throw new Error('File not found');
                        return res.json();
                    })
                    .then(json => {
                        if (json.vocabulary && json.languages && json.foreignLangs && json.hanLangs && json
                            .mandarinIndex !== undefined) {
                            vocabulary = json.vocabulary || [];
                            languages = json.languages || [];
                            foreignLangs = json.foreignLangs || [];
                            hanLangs = json.hanLangs || [];
                            mandarinIndex = json.mandarinIndex;
                            sentences = json.sentences || [];
                            sentenceLanguages = json.sentenceLanguages || [];
                            sentenceForeignLangs = json.sentenceForeignLangs || [];
                            sentenceHanLangs = json.sentenceHanLangs || [];
                            sentenceMandarinIndex = json.sentenceMandarinIndex || -1;

                            if (vocabulary.length > 0) {
                                allDataLoaded = true;
                                currentPage = 1;
                                selectedLangs = [];
                                renderAll();
                                showToolbar(true);
                                uploadZone.style.display = 'none';
                                updateStats();
                                showToast(`📦 自动加载 data 文件 (${vocabulary.length} 个词条，${sentences.length} 个句子)`,
                                    'success');
                                // 加载完成后，尝试从 URL 读取搜索词
                                applySearchFromUrl();
                                return;
                            }
                        }
                        throw new Error('数据格式无效');
                    })
                    .catch(() => {
                        // 若 common.json 不存在，尝试旧文件名
                        const fallbackFile = 'vocabulary-data.json';
                        fetch(fallbackFile)
                            .then(res => {
                                if (!res.ok) throw new Error('File not found');
                                return res.json();
                            })
                            .then(json => {
                                if (json.vocabulary && json.languages) {
                                    vocabulary = json.vocabulary || [];
                                    languages = json.languages || [];
                                    foreignLangs = json.foreignLangs || [];
                                    hanLangs = json.hanLangs || [];
                                    mandarinIndex = json.mandarinIndex || -1;
                                    sentences = json.sentences || [];
                                    sentenceLanguages = json.sentenceLanguages || [];
                                    sentenceForeignLangs = json.sentenceForeignLangs || [];
                                    sentenceHanLangs = json.sentenceHanLangs || [];
                                    sentenceMandarinIndex = json.sentenceMandarinIndex || -1;
                                    if (vocabulary.length > 0) {
                                        allDataLoaded = true;
                                        currentPage = 1;
                                        selectedLangs = [];
                                        renderAll();
                                        showToolbar(true);
                                        uploadZone.style.display = 'none';
                                        updateStats();
                                        showToast(`📦 自动加载 ${fallbackFile} (${vocabulary.length} 个词条，${sentences.length} 个句子)`,
                                            'success');
                                        applySearchFromUrl();
                                        return;
                                    }
                                }
                                throw new Error('数据格式无效');
                            })
                            .catch(() => {
                                autoLoadExcel();
                            });
                    });
            }

            function autoLoadExcel() {
                const fileName = '多种语言词汇表.xlsx';
                fetch(fileName)
                    .then(res => {
                        if (!res.ok) throw new Error('File not found');
                        return res.arrayBuffer();
                    })
                    .then(buffer => {
                        const file = new File([buffer], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                        loadExcelFile(file);
                    })
                    .catch(() => {
                        uploadZone.style.display = 'block';
                        showToolbar(false);
                        if (!allDataLoaded) {
                            cardGrid.innerHTML =
                                `<div class="empty-state"><span class="big-icon">📂</span><h3>未检测到词汇数据</h3><p>请上传 Excel 文件或将 common.json / vocabulary-data.json 放在同目录下</p></div>`;
                        }
                    });
            }

            // ---------- 新增：从 URL 读取搜索词并触发搜索 ----------
            function applySearchFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const searchQuery = urlParams.get('search');
                if (searchQuery && searchInput) {
                    searchInput.value = searchQuery.trim();
                    // 等待数据渲染完成后触发搜索
                    setTimeout(() => {
                        // 触发 input 事件
                        const event = new Event('input', { bubbles: true });
                        searchInput.dispatchEvent(event);
                    }, 100);
                }
            }

            // ---------- 导出数据 ----------
            function exportData() {
                if (!allDataLoaded || vocabulary.length === 0) {
                    showToast('⚠️ 没有数据可导出，请先加载词汇', 'error');
                    return;
                }
                const data = {
                    vocabulary: vocabulary,
                    languages: languages,
                    foreignLangs: foreignLangs,
                    hanLangs: hanLangs,
                    mandarinIndex: mandarinIndex,
                    sentences: sentences,
                    sentenceLanguages: sentenceLanguages,
                    sentenceForeignLangs: sentenceForeignLangs,
                    sentenceHanLangs: sentenceHanLangs,
                    sentenceMandarinIndex: sentenceMandarinIndex,
                    exportedAt: new Date().toISOString(),
                    version: '2.0'
                };
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'common.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`📥 已导出 ${vocabulary.length} 个词条，${sentences.length} 个句子`, 'success');
            }

            // ---------- 获取筛选数据 ----------
            function getFilteredData() {
                const searchTerm = searchInput.value.trim().toLowerCase();
                const filterLangs = selectedLangs.length > 0 ? selectedLangs : getCurrentLangList();

                if (currentMode === 'vocabulary') {
                    return vocabulary.filter(entry => {
                        if (filterLangs.length > 0) {
                            let has = false;
                            for (const lang of filterLangs) {
                                const w = entry.words[lang];
                                if (w && w.text) { has = true; break; }
                            }
                            if (!has) return false;
                        }
                        if (searchTerm) {
                            let match = false;
                            for (const lang of filterLangs) {
                                const w = entry.words[lang];
                                if (!w) continue;
                                const text = (w.text || '').toLowerCase();
                                const pron = (w.pronunciation || '').toLowerCase();
                                if (text.includes(searchTerm) || pron.includes(searchTerm)) {
                                    match = true;
                                    break;
                                }
                            }
                            if (!match) return false;
                        }
                        return true;
                    });
                } else {
                    return sentences.filter(s => {
                        if (filterLangs.length > 0) {
                            let has = false;
                            for (const lang of filterLangs) {
                                const d = s.texts[lang];
                                if (d && d.text && d.text.trim()) { has = true; break; }
                            }
                            if (!has) return false;
                        }
                        if (searchTerm) {
                            let match = false;
                            for (const lang of filterLangs) {
                                const d = s.texts[lang];
                                if (!d) continue;
                                const text = (d.text || '').toLowerCase();
                                const pron = (d.pronunciation || '').toLowerCase();
                                if (text.includes(searchTerm) || pron.includes(searchTerm)) {
                                    match = true;
                                    break;
                                }
                            }
                            if (!match) return false;
                        }
                        return true;
                    });
                }
            }

            // ---------- 查找例句 ----------
            function findSentencesForEntry(entry, displayLangs) {
                if (!sentences.length) return [];
                const searchTexts = [];
                for (const lang of displayLangs) {
                    const w = entry.words[lang];
                    if (w && w.text) {
                        const exps = splitMultiExpressions(w.text);
                        exps.forEach(t => { if (t) searchTexts.push(t.toLowerCase()); });
                    }
                }
                if (searchTexts.length === 0) return [];

                const matches = [];
                for (const sent of sentences) {
                    for (const lang of displayLangs) {
                        const d = sent.texts[lang];
                        const text = d ? d.text : '';
                        if (!text) continue;
                        const lower = text.toLowerCase();
                        for (const search of searchTexts) {
                            if (lower.includes(search)) {
                                matches.push({ lang, text });
                                break;
                            }
                        }
                    }
                }
                const unique = [];
                const seen = new Set();
                for (const m of matches) {
                    const key = m.lang + '|||' + m.text;
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(m);
                    }
                }
                return unique;
            }

            // ---------- 构建语种块 ----------
            function buildLangBlock(lang, data, mode, langList) {
                const idx = langList.indexOf(lang);
                const color = getLangColor(idx >= 0 ? idx : 0);
                const dot = `<span class="dot" style="background:${color};"></span>`;

                if (mode === 'vocabulary') {
                    const w = data;
                    const text = w.text || '';
                    const pron = w.pronunciation || '';
                    const note = w.note || '';
                    if (!text) return '';

                    const wordsArr = splitMultiExpressions(text);
                    const pronsArr = splitMultiExpressions(pron);
                    const pairs = [];
                    const maxLen = Math.max(wordsArr.length, pronsArr.length);
                    for (let i = 0; i < maxLen; i++) {
                        const word = wordsArr[i] || '';
                        const p = pronsArr[i] || '';
                        pairs.push({ word, pron: p });
                    }
                    const displayText = pairs.map(p => {
                        return p.word + (p.pron ? ' ' + p.pron : '');
                    }).join(', ');

                    let noteHtml = '';
                    if (note) {
                        noteHtml = `<div class="note-row">${note}</div>`;
                    }

                    return `
                        <div class="lang-block">
                            <div class="lang-label">${dot} ${lang}</div>
                            <div class="word-pron-row">${displayText}</div>
                            ${noteHtml}
                        </div>
                    `;
                } else {
                    const d = data;
                    const text = d.text || '';
                    const pron = d.pronunciation || '';
                    const note = d.note || '';
                    if (!text) return '';

                    let displayText = text;
                    if (pron) {
                        displayText += ' ' + pron;
                    }
                    let noteHtml = '';
                    if (note) {
                        noteHtml = `<div class="note-row">${note}</div>`;
                    }

                    return `
                        <div class="lang-block">
                            <div class="lang-label">${dot} ${lang}</div>
                            <div class="word-pron-row">${displayText}</div>
                            ${noteHtml}
                        </div>
                    `;
                }
            }

            // ---------- 渲染 ----------
            function renderAll() {
                if (!allDataLoaded || vocabulary.length === 0) {
                    cardGrid.innerHTML =
                        `<div class="empty-state"><span class="big-icon">📂</span><h3>暂无词汇数据</h3><p>请上传 Excel 文件或放置 common.json / vocabulary-data.json</p></div>`;
                    emptyState.style.display = 'none';
                    paginationWrapper.style.display = 'none';
                    return;
                }

                const filtered = getFilteredData();
                const total = filtered.length;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                totalPagesSpan.textContent = totalPages;
                pageInput.value = currentPage;
                pageInput.max = totalPages;
                firstPageBtn.disabled = currentPage === 1;
                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = currentPage === totalPages;
                lastPageBtn.disabled = currentPage === totalPages;
                paginationWrapper.style.display = total > 0 ? 'flex' : 'none';

                if (total === 0) {
                    cardGrid.innerHTML = '';
                    emptyState.style.display = 'block';
                    if (currentMode === 'vocabulary') {
                        emptyTitle.textContent = '未找到匹配的词汇';
                        emptyDesc.textContent = '试试调整搜索关键词或筛选条件';
                    } else {
                        emptyTitle.textContent = '未找到匹配的句子';
                        emptyDesc.textContent = '试试调整搜索关键词或筛选条件';
                    }
                    return;
                }
                emptyState.style.display = 'none';

                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, total);
                const pageItems = filtered.slice(start, end);

                const currentLangList = getCurrentLangList();
                const currentForeign = getCurrentForeignLangs();
                const currentHan = getCurrentHanLangs();

                let displayLangs = selectedLangs.length > 0 ? selectedLangs : currentLangList;
                const displayForeign = displayLangs.filter(l => currentForeign.includes(l));
                const displayHan = displayLangs.filter(l => currentHan.includes(l));

                let html = '';
                pageItems.forEach((item, idx) => {
                    const id = item.id;

                    if (currentMode === 'vocabulary') {
                        let singleBlocks = '';
                        displayLangs.forEach(lang => {
                            const w = item.words[lang];
                            if (!w || !w.text) return;
                            singleBlocks += buildLangBlock(lang, w, 'vocabulary', currentLangList);
                        });

                        let foreignBlocks = '';
                        let hanBlocks = '';
                        displayForeign.forEach(lang => {
                            const w = item.words[lang];
                            if (!w || !w.text) return;
                            foreignBlocks += buildLangBlock(lang, w, 'vocabulary', currentLangList);
                        });
                        displayHan.forEach(lang => {
                            const w = item.words[lang];
                            if (!w || !w.text) return;
                            hanBlocks += buildLangBlock(lang, w, 'vocabulary', currentLangList);
                        });

                        let bodyHtml = '';
                        if (displayMode === 'single') {
                            bodyHtml = `<div class="card-body-single">${singleBlocks}</div>`;
                        } else {
                            let leftCol = foreignBlocks;
                            let rightCol = hanBlocks;
                            if (!leftCol) leftCol =
                                '<div class="lang-block" style="color:#94a3b8;text-align:center;padding:20px;">无外国语</div>';
                            if (!rightCol) rightCol =
                                '<div class="lang-block" style="color:#94a3b8;text-align:center;padding:20px;">无汉方言</div>';
                            bodyHtml = `
                                <div class="card-body-dual">
                                    <div class="lang-group">
                                        <div class="group-title">🌍 外国语</div>
                                        ${leftCol}
                                    </div>
                                    <div class="lang-group">
                                        <div class="group-title">🏯 汉方言</div>
                                        ${rightCol}
                                    </div>
                                </div>
                            `;
                        }

                        const sentenceMatches = findSentencesForEntry(item, displayLangs);

                        html += `
                            <div class="card" data-id="${id}">
                                <div class="card-header">
                                    <span class="index">#${id + 1}</span>
                                </div>
                                ${bodyHtml}
                                <div class="card-footer">
                                    <button class="btn-sentence" data-id="${id}" ${sentenceMatches.length === 0 ? 'disabled' : ''}>
                                        ${sentenceMatches.length > 0 ? `📖 查看例句 (${sentenceMatches.length})` : '📖 无例句'}
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        let singleBlocks = '';
                        displayLangs.forEach(lang => {
                            const d = item.texts[lang];
                            if (!d || !d.text) return;
                            singleBlocks += buildLangBlock(lang, d, 'sentence', currentLangList);
                        });

                        let foreignBlocks = '';
                        let hanBlocks = '';
                        displayForeign.forEach(lang => {
                            const d = item.texts[lang];
                            if (!d || !d.text) return;
                            foreignBlocks += buildLangBlock(lang, d, 'sentence', currentLangList);
                        });
                        displayHan.forEach(lang => {
                            const d = item.texts[lang];
                            if (!d || !d.text) return;
                            hanBlocks += buildLangBlock(lang, d, 'sentence', currentLangList);
                        });

                        let bodyHtml = '';
                        if (displayMode === 'single') {
                            bodyHtml = `<div class="card-body-single">${singleBlocks}</div>`;
                        } else {
                            let leftCol = foreignBlocks;
                            let rightCol = hanBlocks;
                            if (!leftCol) leftCol =
                                '<div class="lang-block" style="color:#94a3b8;text-align:center;padding:20px;">无外国语</div>';
                            if (!rightCol) rightCol =
                                '<div class="lang-block" style="color:#94a3b8;text-align:center;padding:20px;">无汉方言</div>';
                            bodyHtml = `
                                <div class="card-body-dual">
                                    <div class="lang-group">
                                        <div class="group-title">🌍 外国语</div>
                                        ${leftCol}
                                    </div>
                                    <div class="lang-group">
                                        <div class="group-title">🏯 汉方言</div>
                                        ${rightCol}
                                    </div>
                                </div>
                            `;
                        }

                        html += `
                            <div class="card" data-id="${id}">
                                <div class="card-header">
                                    <span class="index">#${id + 1}</span>
                                </div>
                                ${bodyHtml}
                                <div class="card-footer">
                                    <span class="text-muted text-sm">💬 句子</span>
                                </div>
                            </div>
                        `;
                    }
                });

                cardGrid.innerHTML = html;

                if (currentMode === 'vocabulary') {
                    cardGrid.querySelectorAll('.btn-sentence').forEach(btn => {
                        if (btn.disabled) return;
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const id = parseInt(this.dataset.id);
                            const entry = vocabulary.find(e => e.id === id);
                            if (entry) openSentenceModal(entry);
                        });
                    });
                }

                updateStats();
                updateLangPanel();
            }

            // ---------- 模态框 ----------
            function openSentenceModal(entry) {
                const displayLangs = selectedLangs.length > 0 ? selectedLangs : getCurrentLangList();
                const matches = findSentencesForEntry(entry, displayLangs);
                if (matches.length === 0) {
                    modalBody.innerHTML = `<div class="no-sentence">暂无匹配的例句</div>`;
                } else {
                    let html = '';
                    matches.forEach(m => {
                        html += `
                            <div class="sentence-item">
                                <span class="lang-tag">${m.lang}</span>
                                <span class="text">${m.text}</span>
                            </div>
                        `;
                    });
                    modalBody.innerHTML = html;
                }
                const firstLang = displayLangs[0] || getCurrentLangList()[0];
                const firstWord = entry.words[firstLang];
                const titleText = firstWord ? (firstWord.text || '词条') : '词条';
                modalTitle.textContent = `📖 例句 · ${titleText}`;
                modalOverlay.classList.add('open');
            }

            // ---------- 更新统计 ----------
            function updateStats() {
                if (allDataLoaded) {
                    const langList = getCurrentLangList();
                    langCountBadge.textContent = `${langList.length} 种语言`;
                    if (currentMode === 'vocabulary') {
                        entryCountStat.textContent = `${vocabulary.length} 个词条`;
                    } else {
                        entryCountStat.textContent = `${sentences.length} 个句子`;
                    }
                } else {
                    langCountBadge.textContent = '0 种语言';
                    entryCountStat.textContent = '0 个词条';
                }
            }

            // ---------- 语种面板 ----------
            function getLangCounts() {
                const langList = getCurrentLangList();
                const counts = {};
                const data = getCurrentData();
                langList.forEach(lang => {
                    let count = 0;
                    if (currentMode === 'vocabulary') {
                        count = data.filter(e => {
                            const w = e.words[lang];
                            return w && w.text;
                        }).length;
                    } else {
                        count = data.filter(s => {
                            const d = s.texts[lang];
                            return d && d.text && d.text.trim();
                        }).length;
                    }
                    counts[lang] = count;
                });
                return counts;
            }

            function updateLangPanel() {
                const langList = getCurrentLangList();
                const counts = getLangCounts();
                const allCount = getCurrentData().length;
                const isAllSelected = selectedLangs.length === 0;

                let html = '';
                html += `
                    <label class="lang-item" data-lang="__all__">
                        <input type="checkbox" ${isAllSelected ? 'checked' : ''} />
                        <span class="lang-label">全部</span>
                        <span class="count">${allCount}</span>
                    </label>
                `;

                langList.forEach((lang, idx) => {
                    const count = counts[lang] || 0;
                    const checked = selectedLangs.includes(lang);
                    const color = getLangColor(idx);
                    html += `
                        <label class="lang-item" data-lang="${lang}">
                            <input type="checkbox" ${checked ? 'checked' : ''} />
                            <span class="lang-label">
                                <span class="dot" style="background:${color};"></span>
                                ${lang}
                            </span>
                            <span class="count">${count}</span>
                        </label>
                    `;
                });

                langGrid.innerHTML = html;

                langGrid.querySelectorAll('.lang-item input[type="checkbox"]').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const lang = this.closest('.lang-item').dataset.lang;
                        if (lang === '__all__') {
                            const checked = this.checked;
                            langGrid.querySelectorAll('.lang-item input[type="checkbox"]').forEach(c => {
                                c.checked = checked;
                            });
                        } else {
                            const allCb = langGrid.querySelector('.lang-item[data-lang="__all__"] input');
                            if (!this.checked && allCb) {
                                allCb.checked = false;
                            }
                            const allLangItems = langGrid.querySelectorAll('.lang-item:not([data-lang="__all__"]) input');
                            let allChecked = true;
                            allLangItems.forEach(c => { if (!c.checked) allChecked = false; });
                            if (allChecked && allCb) {
                                allCb.checked = true;
                            }
                        }
                    });
                });

                updateLangBadge();
            }

            function updateLangBadge() {
                if (selectedLangs.length === 0) {
                    langBadgeCount.textContent = '全部';
                } else {
                    langBadgeCount.textContent = selectedLangs.length;
                }
            }

            function applyLangSelection() {
                const checkedItems = langGrid.querySelectorAll('.lang-item input[type="checkbox"]:checked');
                const allCb = langGrid.querySelector('.lang-item[data-lang="__all__"] input');
                const isAllChecked = allCb && allCb.checked;

                if (isAllChecked) {
                    selectedLangs = [];
                } else {
                    const newSelected = [];
                    checkedItems.forEach(cb => {
                        const lang = cb.closest('.lang-item').dataset.lang;
                        if (lang !== '__all__') newSelected.push(lang);
                    });
                    selectedLangs = newSelected;
                }
                currentPage = 1;
                updateLangBadge();
                closeLangPanel();
                renderAll();
            }

            function toggleLangPanel() {
                isLangPanelOpen = !isLangPanelOpen;
                if (isLangPanelOpen) {
                    updateLangPanel();
                    langPanel.classList.add('open');
                    langArrow.classList.add('open');
                } else {
                    closeLangPanel();
                }
            }

            function closeLangPanel() {
                isLangPanelOpen = false;
                langPanel.classList.remove('open');
                langArrow.classList.remove('open');
            }

            // ---------- 显示工具栏 ----------
            function showToolbar(show) {
                toolbar.style.display = show ? 'flex' : 'none';
            }

            // ---------- 分页 ----------
            function goToPage(page) {
                const filtered = getFilteredData();
                const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
                if (page < 1) page = 1;
                if (page > totalPages) page = totalPages;
                if (currentPage !== page) {
                    currentPage = page;
                    renderAll();
                }
            }

            // ---------- 事件绑定 ----------
            firstPageBtn.addEventListener('click', () => goToPage(1));
            prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
            nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));
            lastPageBtn.addEventListener('click', () => goToPage(parseInt(totalPagesSpan.textContent) || 1));

            pageInput.addEventListener('change', function() {
                let val = parseInt(this.value);
                if (isNaN(val) || val < 1) val = 1;
                const total = parseInt(totalPagesSpan.textContent) || 1;
                if (val > total) val = total;
                this.value = val;
                goToPage(val);
            });

            pageSizeSelect.addEventListener('change', function() {
                pageSize = parseInt(this.value);
                currentPage = 1;
                renderAll();
            });

            let searchTimeout = null;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentPage = 1;
                    renderAll();
                }, 200);
            });

            modeSwitch.addEventListener('click', function(e) {
                const btn = e.target.closest('.btn');
                if (!btn || btn.classList.contains('active')) return;
                const mode = btn.dataset.mode;
                if (mode === 'vocabulary' || mode === 'sentence') {
                    currentMode = mode;
                    this.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPage = 1;
                    if (mode === 'vocabulary') {
                        searchInput.placeholder = '搜索词汇或发音...';
                    } else {
                        searchInput.placeholder = '搜索句子...';
                    }
                    renderAll();
                }
            });

            displaySwitch.addEventListener('click', function(e) {
                const btn = e.target.closest('.btn');
                if (!btn || btn.classList.contains('active')) return;
                const mode = btn.dataset.display;
                if (mode === 'single' || mode === 'dual') {
                    displayMode = mode;
                    this.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderAll();
                }
            });

            langSelectorBtn.addEventListener('click', toggleLangPanel);

            document.addEventListener('click', function(e) {
                const panel = langPanel;
                const btn = langSelectorBtn;
                if (isLangPanelOpen && !panel.contains(e.target) && !btn.contains(e.target)) {
                    closeLangPanel();
                }
            });

            selectAllLang.addEventListener('click', function() {
                langGrid.querySelectorAll('.lang-item input[type="checkbox"]').forEach(cb => {
                    cb.checked = true;
                });
            });
            deselectAllLang.addEventListener('click', function() {
                langGrid.querySelectorAll('.lang-item input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                });
            });

            langPanelConfirm.addEventListener('click', applyLangSelection);

            uploadBtn.addEventListener('click', () => fileInput.click());

            uploadZone.addEventListener('dragover', (e) => { e.preventDefault();
                uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', (e) => { e.preventDefault();
                uploadZone.classList.remove('dragover'); });
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext === 'xlsx' || ext === 'xls') loadExcelFile(file);
                    else showToast('请上传 .xlsx 或 .xls 文件', 'error');
                }
            });

            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) loadExcelFile(this.files[0]);
                this.value = '';
            });

            exportBtn.addEventListener('click', exportData);

            modalClose.addEventListener('click', () => modalOverlay.classList.remove('open'));
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove(
                    'open'); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modalOverlay.classList.remove('open'); });

            // ---------- 初始化 ----------
            pageSizeSelect.value = '1';
            pageSize = 1;
            autoLoadDataFile();

            // 即使自动加载完成前，也尝试从 URL 读取（但可能元素未就绪），但 applySearchFromUrl 在加载完成后会再次调用
            // 初次调用以防快速加载
            setTimeout(() => {
                if (document.getElementById('searchInput')) {
                    applySearchFromUrl();
                }
            }, 500);

        })();
    </script>
</body>
</html>
