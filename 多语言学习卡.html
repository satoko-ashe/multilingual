<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多语言学习卡 · 词汇 & 句子</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局（与原保持一致） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f6f8fc;
            color: #1a1e2b;
            padding: 20px 24px 60px;
            min-height: 100vh;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 24px;
            margin-bottom: 24px;
            background: #ffffffcc;
            backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02), 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .header-left h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }
        .header-left .badge {
            background: #eef2ff;
            color: #4338ca;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #c7d2fe;
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-actions .stat {
            font-size: 14px;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
            user-select: none;
        }
        .btn:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }
        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        .btn-success {
            background: #16a34a;
            border-color: #16a34a;
            color: #fff;
        }
        .btn-success:hover {
            background: #15803d;
            border-color: #15803d;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 13px;
        }

        /* ===== 上传区 ===== */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 28px;
            padding: 48px 20px 40px;
            text-align: center;
            background: #fafcff;
            transition: all 0.25s;
            margin-bottom: 28px;
            cursor: default;
        }
        .upload-zone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .upload-zone .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .upload-zone h3 {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
        }
        .upload-zone .desc {
            color: #64748b;
            font-size: 15px;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px 16px;
        }
        .upload-zone .desc .divider {
            color: #cbd5e1;
            font-weight: 300;
        }
        .upload-zone .hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 14px;
        }
        .upload-zone .hint strong {
            color: #64748b;
            font-weight: 600;
        }
        .upload-zone input[type="file"] {
            display: none;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
            margin-bottom: 24px;
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            padding: 12px 22px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            position: relative;
        }
        .search-wrap {
            flex: 1 1 200px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrap .search-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 18px;
            pointer-events: none;
        }
        .search-wrap input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 15px;
            background: #f8fafc;
            transition: all 0.2s;
            outline: none;
            color: #0f172a;
        }
        .search-wrap input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .search-wrap input::placeholder {
            color: #94a3b8;
        }

        /* 语种选择按钮 */
        .lang-selector-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 40px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .lang-selector-btn:hover {
            background: #e2e8f0;
        }
        .lang-selector-btn .arrow {
            font-size: 12px;
            transition: transform 0.2s;
        }
        .lang-selector-btn .arrow.open {
            transform: rotate(180deg);
        }
        .lang-selector-btn .badge-count {
            background: #2563eb;
            color: #fff;
            border-radius: 30px;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 600;
            line-height: 20px;
            min-width: 20px;
            text-align: center;
        }

        /* 语种弹出面板 */
        .lang-panel {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            padding: 16px 24px 16px;
            z-index: 100;
            display: none;
            max-height: 60vh;
            min-width: 420px;
            width: auto;
            overflow-y: auto;
        }
        .lang-panel.open {
            display: block;
        }
        .lang-panel .panel-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .lang-panel .panel-actions {
            display: flex;
            gap: 8px;
        }
        .lang-panel .panel-actions .btn {
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 30px;
        }
        .lang-panel .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 6px 12px;
        }
        .lang-panel .lang-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 14px;
            color: #1e293b;
        }
        .lang-panel .lang-item:hover {
            background: #f1f5f9;
        }
        .lang-panel .lang-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
            flex-shrink: 0;
        }
        .lang-panel .lang-item .lang-label {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .lang-panel .lang-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            display: inline-block;
        }
        .lang-panel .lang-item .count {
            font-size: 12px;
            color: #94a3b8;
            margin-left: auto;
        }
        .lang-panel .panel-footer {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .lang-panel .panel-footer .btn {
            padding: 6px 22px;
            font-size: 14px;
        }

        /* 模式切换 */
        .mode-switch {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 4px;
            flex-shrink: 0;
        }
        .mode-switch .btn {
            border: none;
            background: transparent;
            padding: 6px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            border-radius: 30px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .mode-switch .btn.active {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: #0f172a;
        }
        .mode-switch .btn:hover:not(.active) {
            background: #e2e8f0;
        }

        /* 显示模式切换 */
        .display-switch {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 4px;
            flex-shrink: 0;
        }
        .display-switch .btn {
            border: none;
            background: transparent;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            border-radius: 30px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .display-switch .btn.active {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: #0f172a;
        }
        .display-switch .btn:hover:not(.active) {
            background: #e2e8f0;
        }

        /* ===== 卡片 ===== */
        .card-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 4px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 28px 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid #edf2f7;
            transition: all 0.2s;
            width: 100%;
            max-width: 100%;
        }
        .card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            border-color: #e2e8f0;
        }

        .card-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
        }
        .card-header .index {
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            background: #f8fafc;
            padding: 4px 16px;
            border-radius: 40px;
        }

        .card-body-dual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card-body-dual .lang-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-body-dual .group-title {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            padding-bottom: 4px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 2px;
        }

        .card-body-single {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lang-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 12px 18px;
            border-radius: 16px;
            background: #fafcff;
            border: 1px solid #f1f5f9;
            transition: background 0.15s;
        }
        .lang-block:hover {
            background: #f8fafc;
        }
        .lang-block .lang-label {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }
        .lang-block .lang-label .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .lang-block .word-pron-row {
            font-size: 16px;
            color: #0f172a;
            padding-left: 22px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .lang-block .note-row {
            padding-left: 22px;
            font-size: 13px;
            color: #8b5cf6;
            background: #f5f3ff;
            border-radius: 30px;
            padding: 3px 16px;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
            border: 1px solid #ede9fe;
            white-space: pre-wrap;
        }
        .lang-block .sentence-text {
            font-size: 16px;
            color: #0f172a;
            padding-left: 22px;
            line-height: 1.7;
            word-break: break-word;
        }

        .card-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-footer .btn-sentence {
            font-size: 14px;
            background: #f1f5f9;
            border: none;
            padding: 6px 22px;
            border-radius: 30px;
            color: #2563eb;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-footer .btn-sentence:hover:not(:disabled) {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .card-footer .btn-sentence:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f1f5f9;
            color: #94a3b8;
        }

        /* ===== 分页 ===== */
        .pagination-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 18px;
            margin: 24px 0 10px;
            padding: 12px 20px;
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .pagination-wrapper .p-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pagination-wrapper .p-btn:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .pagination-wrapper .p-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination-wrapper .page-info {
            font-size: 14px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pagination-wrapper .page-input {
            width: 52px;
            padding: 6px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            background: #f8fafc;
            outline: none;
        }
        .pagination-wrapper .page-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .pagination-wrapper .page-size-select {
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .pagination-wrapper .page-size-select:focus {
            border-color: #2563eb;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state .big-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-size: 20px;
            color: #475569;
            font-weight: 500;
        }
        .empty-state p {
            margin-top: 6px;
            font-size: 15px;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #ffffff;
            border-radius: 28px;
            max-width: 680px;
            width: 100%;
            max-height: 80vh;
            padding: 28px 32px 32px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.16);
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
        }
        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: #475569;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .modal-body .sentence-item {
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 14px;
            margin-bottom: 10px;
            border-left: 4px solid #2563eb;
        }
        .modal-body .sentence-item .lang-tag {
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            display: inline-block;
            margin-right: 10px;
        }
        .modal-body .sentence-item .text {
            font-size: 15px;
            white-space: pre-wrap;
        }
        .modal-body .no-sentence {
            color: #94a3b8;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== 动画 ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e293b;
            color: #f8fafc;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 2000;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #2563eb;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            body {
                padding: 16px 16px 50px;
            }
            .app {
                max-width: 100%;
            }
            .card {
                padding: 20px 18px 18px;
            }
            .card-body-dual {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .lang-block {
                padding: 10px 14px;
            }
            .lang-block .word-pron-row,
            .lang-block .sentence-text {
                padding-left: 12px;
            }
            .lang-block .note-row {
                padding-left: 12px;
            }
            .lang-panel {
                min-width: unset;
                left: 8px;
                right: 8px;
                padding: 16px;
            }
            .lang-panel .lang-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
        @media (max-width: 700px) {
            .header {
                padding: 14px 18px;
                flex-direction: column;
                align-items: stretch;
            }
            .header-left h1 {
                font-size: 22px;
            }
            .header-actions {
                justify-content: flex-start;
            }
            .toolbar {
                padding: 12px 14px;
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrap {
                flex: 1 1 auto;
            }
            .lang-selector-btn {
                width: 100%;
                justify-content: center;
            }
            .mode-switch,
            .display-switch {
                align-self: center;
            }
            .lang-panel {
                left: 4px;
                right: 4px;
                padding: 12px;
            }
            .lang-panel .lang-grid {
