    <script>
        // ============================================================
        //  DATA STORE
        // ============================================================
        const dataStore = {
            charPinyinMap: {},
            charInfoMap: {},
            nearGroups: {},
            nearCharToGroup: {},
            sentences: [],
            wordList: [],
            videoInfo: null,
            videoLinks: {}
        };

        let currentLang = 'cz';
        let currentText = '';
        let selectionMode = false;
        let selectedPairs = new Set();
        let instancePinyinMap = {};
        let activePopup = null;

        let searchResults = [];
        let searchPage = 1;
        const searchPageSize = 20;

        // ============================================================
        //  NEW: TOKENIZATION & PINYIN LOOKUP (upgraded)
        // ============================================================

        function isPunct(char) {
            return /[，。、；：！？《》「」『』（）【】—…·'"“”‘’\.,;:!?()\[\]{}<>\/\\|`~@#$%^&*\-_=+]/.test(char);
        }

        function getPinyinsForUnit(unit) {
            if (dataStore.charPinyinMap[unit]) {
                return dataStore.charPinyinMap[unit];
            }
            for (const w of dataStore.wordList) {
                if (w.word === unit) {
                    return w.pinyin ? w.pinyin.split(/\s+/) : [];
                }
            }
            return [];
        }

        function getDefaultPinyinForUnit(unit) {
            const pinyins = getPinyinsForUnit(unit);
            return pinyins.length > 0 ? pinyins[0] : '';
        }

        function buildTokenDict() {
            const dict = new Map();
            for (const [key, pinyins] of Object.entries(dataStore.charPinyinMap)) {
                if (pinyins && pinyins.length) {
                    dict.set(key, pinyins);
                }
            }
            for (const w of dataStore.wordList) {
                if (w.word && !dict.has(w.word)) {
                    const pinyins = w.pinyin ? w.pinyin.split(/\s+/) : [];
                    if (pinyins.length) dict.set(w.word, pinyins);
                }
            }
            return dict;
        }

        function splitJapanese(text) {
            const HIRAGANA_YOON = new Set('きぎしじちにひびぴみり');
            const KATAKANA_YOON = new Set('キギシジチニヒビピミリ');
            const SMALL_YOON_HIRA = new Set('ゃゅょ');
            const SMALL_YOON_KATA = new Set('ャュョ');
            const units = [];
            let i = 0;
            while (i < text.length) {
                const ch = text[i];
                if (HIRAGANA_YOON.has(ch) && i + 1 < text.length && SMALL_YOON_HIRA.has(text[i + 1])) {
                    units.push(ch + text[i + 1]);
                    i += 2;
                } else if (KATAKANA_YOON.has(ch) && i + 1 < text.length && SMALL_YOON_KATA.has(text[i + 1])) {
                    units.push(ch + text[i + 1]);
                    i += 2;
                } else {
                    units.push(ch);
                    i++;
                }
            }
            return units;
        }

        function tokenizeText(text, tokenDict, lang) {
            if (lang === 'en') {
                const words = text.split(/\s+/).filter(w => w.length > 0);
                const sortedKeys = Array.from(tokenDict.keys()).sort((a, b) => b.length - a.length);
                return words.map(w => {
                    for (const key of sortedKeys) {
                        if (w.toLowerCase() === key.toLowerCase()) return key;
                    }
                    return w;
                });
            } else if (lang === 'ja') {
                const rawUnits = splitJapanese(text);
                const sortedKeys = Array.from(tokenDict.keys()).sort((a, b) => b.length - a.length);
                const result = [];
                let i = 0;
                while (i < rawUnits.length) {
                    let matched = false;
                    for (const key of sortedKeys) {
                        const sub = rawUnits.slice(i, i + key.length).join('');
                        if (sub === key) {
                            result.push(key);
                            i += key.length;
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) {
                        result.push(rawUnits[i]);
                        i++;
                    }
                }
                return result;
            } else {
                const sortedKeys = Array.from(tokenDict.keys()).sort((a, b) => b.length - a.length);
                const units = [];
                let i = 0;
                while (i < text.length) {
                    let matched = false;
                    for (const key of sortedKeys) {
                        if (text.startsWith(key, i)) {
                            units.push(key);
                            i += key.length;
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) {
                        const ch = text[i];
                        if (ch !== ' ') units.push(ch);
                        i++;
                    }
                }
                return units;
            }
        }

        // ============================================================
        //  LEGACY WRAPPERS (for compatibility)
        // ============================================================
        function getAllPinyinsForChar(char) {
            return getPinyinsForUnit(char);
        }

        function getDefaultPinyin(char) {
            return getDefaultPinyinForUnit(char);
        }

        // ============================================================
        //  DATA LOADING (unchanged, uses isPunct)
        // ============================================================
        function loadDataFromExcel(workbook) {
            dataStore.charPinyinMap = {};
            dataStore.charInfoMap = {};
            dataStore.nearGroups = {};
            dataStore.nearCharToGroup = {};
            dataStore.sentences = [];
            dataStore.wordList = [];
            dataStore.videoInfo = null;
            dataStore.videoLinks = {};

            const sheetNames = workbook.SheetNames;

            const videoSheet = workbook.Sheets[sheetNames.find(s => s.includes('视频来源') || s.includes('来源'))];
            if (videoSheet) {
                const rows = XLSX.utils.sheet_to_json(videoSheet);
                rows.forEach(row => {
                    const name = row['名称'] || '';
                    const link = row['链接'] || '';
                    if (name && link) {
                        const match = name.match(/(视频\d+)/);
                        if (match) {
                            const key = match[1];
                            dataStore.videoLinks[key] = link;
                        }
                        dataStore.videoLinks[name] = link;
                        if (!dataStore.videoInfo) dataStore.videoInfo = { name, link };
                    }
                });
            }

            const charSheet = workbook.Sheets[sheetNames.find(s => s.includes('常用字'))];
            if (charSheet) {
                const rows = XLSX.utils.sheet_to_json(charSheet);
                rows.forEach(row => {
                    const ch = row['常用字'] || '';
                    const pinyin = row['潮州话音标'] || '';
                    const words = row['词汇'] || '';
                    const examples = row['例子'] || '';
                    const note = row['备注'] || '';
                    const traditional = row['繁体字'] || '';
                    const radical = row['部首'] || '';
                    const body = row['主体'] || '';
                    if (ch && pinyin) {
                        const pinyins = pinyin.split(/[,，、\s]+/).filter(s => s);
                        const uniquePinyins = [...new Set(pinyins)];
                        dataStore.charPinyinMap[ch] = uniquePinyins;
                        dataStore.charInfoMap[ch] = {
                            words: words ? words.split(/[,，、\s]+/).filter(s => s) : [],
                            examples: examples ? examples.split(/[,，、\s]+/).filter(s => s) : [],
                            note: note || '',
                            traditional: traditional || '',
                            radical: radical || '',
                            body: body || ''
                        };
                        if (body) {
                            const bodies = body.split(',').map(b => b.trim()).filter(b => b);
                            bodies.forEach(b => {
                                if (!dataStore.nearGroups[b]) dataStore.nearGroups[b] = [];
                                if (!dataStore.nearGroups[b].includes(ch)) {
                                    dataStore.nearGroups[b].push(ch);
                                }
                                dataStore.nearCharToGroup[ch] = b;
                            });
                        }
                    }
                });
            } else {
                console.warn('未找到"常用字"工作表，将依赖转录文本补充发音');
            }

            const transSheet = workbook.Sheets[sheetNames.find(s => s.includes('转录'))];
            if (transSheet) {
                const rows = XLSX.utils.sheet_to_json(transSheet);
                rows.forEach(row => {
                    const text = row['原文'] || '';
                    const pinyin = row['发音'] || '';
                    const translation = row['译文'] || '';
                    const time = row['时间轴'] || '';
                    const speaker = row['说话人'] || '';
                    const project = row['项目'] || '';
                    if (text) {
                        dataStore.sentences.push({
                            text,
                            pinyin,
                            translation,
                            time,
                            speaker,
                            project: project,
                            videoLink: dataStore.videoLinks[project] || null
                        });
                        if (pinyin) {
                            const syllables = pinyin.trim().split(/\s+/);
                            const chars = [...text];
                            let sIdx = 0;
                            for (let i = 0; i < chars.length; i++) {
                                const ch = chars[i];
                                if (isPunct(ch)) continue;
                                if (sIdx < syllables.length) {
                                    const syl = syllables[sIdx];
                                    if (!dataStore.charPinyinMap[ch] || dataStore.charPinyinMap[ch].length === 0) {
                                        dataStore.charPinyinMap[ch] = [];
                                    }
                                    if (dataStore.charPinyinMap[ch].length > 0) {} else {
                                        if (!dataStore.charPinyinMap[ch].includes(syl)) {
                                            dataStore.charPinyinMap[ch].push(syl);
                                        }
                                    }
                                    sIdx++;
                                }
                            }
                        }
                    }
                });
            }

            const vocabSheet = workbook.Sheets[sheetNames.find(s => s.includes('高频') || s.includes('词汇'))];
            if (vocabSheet) {
                const rows = XLSX.utils.sheet_to_json(vocabSheet);
                rows.forEach(row => {
                    const word = row['词汇'] || '';
                    const pinyin = row['发音'] || '';
                    const pos = row['词性大类'] || '';
                    const meaning = row['含义'] || '';
                    if (word && pinyin) {
                        const exists = dataStore.wordList.some(w => w.word === word);
                        if (!exists) {
                            dataStore.wordList.push({ word, pinyin, pos, meaning });
                        }
                        for (const ch of [...word]) {
                            if (isPunct(ch)) continue;
                            if (!dataStore.charPinyinMap[ch] || dataStore.charPinyinMap[ch].length === 0) {
                                const syl = pinyin.trim().split(/\s+/)[0] || '';
                                if (syl) {
                                    dataStore.charPinyinMap[ch] = [syl];
                                }
                            }
                        }
                    }
                });
            }

            for (const ch in dataStore.charPinyinMap) {
                if (dataStore.charPinyinMap[ch].length === 0) {
                    dataStore.charPinyinMap[ch] = ['?'];
                }
            }

            updateStats();
            showToast('✅ 数据加载成功！(常用字发音优先，不补充已有字)', 'success');
            renderPanel(currentText || '');
        }

        function updateStats() {
            const charCount = Object.keys(dataStore.charPinyinMap).length;
            const nearCount = Object.keys(dataStore.nearGroups).length;
            const sentenceCount = dataStore.sentences.length;
            const wordCount = dataStore.wordList.length;
            document.getElementById('statChars').textContent = charCount;
            document.getElementById('statNear').textContent = nearCount;
            document.getElementById('statSentences').textContent = sentenceCount;
            document.getElementById('statWords').textContent = wordCount;
            document.getElementById('dataStatusText').textContent =
                `已加载：${charCount}字，${nearCount}组近形，${sentenceCount}句，${wordCount}词 (常用字发音优先)`;
            document.getElementById('dataDetail').textContent =
                `字音严格以“常用字”表为准，其他来源仅补充未收录的字；形近字基于“主体”列构建。`;
        }

        function getCharInfo(char) {
            return dataStore.charInfoMap[char] || { words: [], examples: [], note: '', traditional: '', radical: '',
                body: '' };
        }

        function getNearGroupByChar(char) {
            const groupKey = dataStore.nearCharToGroup[char];
            if (groupKey && dataStore.nearGroups[groupKey]) {
                return dataStore.nearGroups[groupKey];
            }
            return null;
        }

        function getTraditional(char) {
            const info = dataStore.charInfoMap[char];
            return info ? info.traditional || '' : '';
        }

        function getRadical(char) {
            const info = dataStore.charInfoMap[char];
            return info ? info.radical || '' : '';
        }

        function getBody(char) {
            const info = dataStore.charInfoMap[char];
            return info ? info.body || '' : '';
        }

        // ============================================================
        //  RENDER PANEL (using new tokenization)
        // ============================================================
        function renderPanel(text) {
            const grid = document.getElementById('typeGrid');
            const hint = document.getElementById('emptyHint');
            const countEl = document.getElementById('charCount');

            currentText = text || '';
            instancePinyinMap = {};

            if (!text || text.length === 0) {
                grid.style.display = 'none';
                hint.style.display = 'flex';
                grid.innerHTML = '';
                selectedPairs.clear();
                updateSelectedCount();
                countEl.textContent = '0 单元';
                document.getElementById('directTrans').textContent = '等待翻译…';
                document.getElementById('freeTransMain').textContent = '等待翻译…';
                document.getElementById('refGlobal').classList.remove('open');
                document.getElementById('refBodyGlobal').innerHTML = '';
                document.getElementById('refBodyGlobal').classList.remove('show');
                return;
            }

            const tokenDict = buildTokenDict();
            let units = tokenizeText(text, tokenDict, currentLang);

            if (units.length === 0) {
                grid.style.display = 'none';
                hint.style.display = 'flex';
                grid.innerHTML = '';
                selectedPairs.clear();
                updateSelectedCount();
                countEl.textContent = '0 单元';
                document.getElementById('directTrans').textContent = '等待翻译…';
                document.getElementById('freeTransMain').textContent = '等待翻译…';
                document.getElementById('refGlobal').classList.remove('open');
                document.getElementById('refBodyGlobal').innerHTML = '';
                document.getElementById('refBodyGlobal').classList.remove('show');
                return;
            }

            countEl.textContent = units.length + ' 单元';
            hint.style.display = 'none';
            grid.style.display = 'grid';

            let html = '';
            units.forEach((unit, index) => {
                const col = (index % 20) + 1;
                const rowPinyin = Math.floor(index / 20) * 2 + 1;
                const rowChar = Math.floor(index / 20) * 2 + 2;

                let isP = false;
                if (currentLang === 'en') {
                    isP = /[.,!?;:]/.test(unit);
                } else {
                    isP = isPunct(unit);
                }

                const pinyins = getPinyinsForUnit(unit);
                const hasMultiple = pinyins.length > 1;
                const defaultPinyin = pinyins.length > 0 ? pinyins[0] : '';
                const instancePinyin = instancePinyinMap[index] || defaultPinyin;
                const displayPinyin = isP ? '' : instancePinyin;
                const pinyinClass = `pinyin-cell ${isP ? 'is-punct' : ''} ${displayPinyin ? '' : 'empty-pinyin'}`;
                const charClass = `char-cell ${isP ? 'is-punct' : ''} ${hasMultiple ? 'has-multiple' : ''}`;

                html += `<div class="${pinyinClass}" 
                              data-char="${unit}" 
                              data-pair-index="${index}"
                              data-row="pinyin"
                              data-has-multiple="${hasMultiple ? 'true' : 'false'}"
                              data-pinyins='${JSON.stringify(pinyins)}'
                              data-current-pinyin="${displayPinyin}"
                              style="grid-column: ${col}; grid-row: ${rowPinyin};">
                              ${displayPinyin}
                          </div>`;

                html += `<div class="${charClass}" 
                              data-char="${unit}" 
                              data-pair-index="${index}"
                              data-row="char"
                              data-has-multiple="${hasMultiple ? 'true' : 'false'}"
                              data-pinyins='${JSON.stringify(pinyins)}'
                              data-current-pinyin="${displayPinyin}"
                              style="grid-column: ${col}; grid-row: ${rowChar};">
                              ${unit}
                          </div>`;
            });

            grid.innerHTML = html;
            selectedPairs.clear();
            updateSelectedCount();

            grid.querySelectorAll('.char-cell:not(.is-punct)').forEach(el => {
                el.addEventListener('mouseenter', function(e) {
                    const char = this.dataset.char;
                    if (char && char.length > 0) {
                        document.getElementById('searchInput').value = char;
                        document.getElementById('searchType').value = 'all';
                        doSearch();
                    }
                });
            });

            grid.removeEventListener('click', onGridClick);
            grid.addEventListener('click', onGridClick);

            requestAnimationFrame(() => {
                const items = grid.querySelectorAll('.pinyin-cell, .char-cell');
                items.forEach((el, i) => {
                    setTimeout(() => {
                        el.classList.add('printing');
                    }, i * 10);
                });
            });

            autoTranslate(text);
        }

        // ============================================================
        //  CLICK HANDLER (多音字)
        // ============================================================
        function onGridClick(e) {
            const target = e.target.closest('.pinyin-cell, .char-cell');
            if (!target) return;
            const pairIndex = parseInt(target.dataset.pairIndex);
            if (isNaN(pairIndex)) return;

            if (selectionMode) {
                togglePairSelection(pairIndex);
                e.stopPropagation();
                return;
            }

            if (target.classList.contains('char-cell') && !target.classList.contains('is-punct')) {
                const hasMultiple = target.dataset.hasMultiple === 'true';
                if (!hasMultiple) return;
                const pinyins = JSON.parse(target.dataset.pinyins);
                if (pinyins.length < 2) return;

                closePopup();
                const rect = target.getBoundingClientRect();
                const popup = document.createElement('div');
                popup.className = 'pinyin-popup show';
                popup.style.left = (rect.left + rect.width / 2 - 50) + 'px';
                popup.style.top = (rect.top - 10) + 'px';
                popup.style.transform = 'translateY(-100%)';

                const currentPinyin = target.dataset.currentPinyin || pinyins[0];
                pinyins.forEach(p => {
                    const item = document.createElement('button');
                    item.className = 'popup-item' + (p === currentPinyin ? ' active' : '');
                    item.textContent = p;
                    item.dataset.pinyin = p;
                    item.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        selectPinyin(pairIndex, p);
                        closePopup();
                    });
                    popup.appendChild(item);
                });

                document.body.appendChild(popup);
                activePopup = popup;
                const closeHandler = (ev) => {
                    if (!popup.contains(ev.target) && !ev.target.closest('.char-cell')) {
                        closePopup();
                        document.removeEventListener('click', closeHandler);
                    }
                };
                setTimeout(() => document.addEventListener('click', closeHandler), 10);
                e.stopPropagation();
            }
        }

        function closePopup() {
            if (activePopup) { activePopup.remove();
                activePopup = null; }
        }

        function selectPinyin(pairIndex, pinyin) {
            instancePinyinMap[pairIndex] = pinyin;
            const pinyinEl = document.querySelector(`.pinyin-cell[data-pair-index="${pairIndex}"]`);
            const charEl = document.querySelector(`.char-cell[data-pair-index="${pairIndex}"]`);
            if (pinyinEl) {
                pinyinEl.textContent = pinyin;
                pinyinEl.dataset.currentPinyin = pinyin;
                pinyinEl.classList.remove('empty-pinyin');
            }
            if (charEl) charEl.dataset.currentPinyin = pinyin;
            showToast('已切换读音：' + pinyin, 'success');
        }

        // ============================================================
        //  SELECTION
        // ============================================================
        function togglePairSelection(pairIndex) {
            if (selectedPairs.has(pairIndex)) selectedPairs.delete(pairIndex);
            else selectedPairs.add(pairIndex);
            updateSelectionUI();
            updateSelectedCount();
        }

        function updateSelectionUI() {
            document.querySelectorAll('.pinyin-cell, .char-cell').forEach(el => el.classList.remove('selected'));
            selectedPairs.forEach(idx => {
                document.querySelector(`.pinyin-cell[data-pair-index="${idx}"]`)?.classList.add('selected');
                document.querySelector(`.char-cell[data-pair-index="${idx}"]`)?.classList.add('selected');
            });
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `已选 ${selectedPairs.size}`;
        }

        function clearSelection() {
            selectedPairs.clear();
            updateSelectionUI();
            updateSelectedCount();
            showToast('已取消选择', 'info');
        }

        function selectAll() {
            const allPairs = document.querySelectorAll('.pinyin-cell');
            if (allPairs.length === 0) { showToast('没有活字', 'warning'); return; }
            const modeCheckbox = document.getElementById('selectionMode');
            if (!selectionMode) {
                modeCheckbox.checked = true;
                selectionMode = true;
                showToast('🎯 已开启选择模式', 'info');
            }
            allPairs.forEach(el => {
                const idx = parseInt(el.dataset.pairIndex);
                if (!isNaN(idx)) selectedPairs.add(idx);
            });
            updateSelectionUI();
            updateSelectedCount();
            showToast(`✅ 已全选 ${selectedPairs.size} 个`, 'success');
        }

        function copySelected() {
            if (selectedPairs.size === 0) { showToast('请先选择', 'warning'); return; }
            const sorted = Array.from(selectedPairs).sort((a, b) => a - b);
            let pinyinLine = '',
                charLine = '';
            sorted.forEach((idx, i) => {
                const pinyinEl = document.querySelector(`.pinyin-cell[data-pair-index="${idx}"]`);
                const charEl = document.querySelector(`.char-cell[data-pair-index="${idx}"]`);
                if (pinyinEl && charEl) {
                    const p = pinyinEl.textContent.trim() || ' ';
                    const c = charEl.textContent.trim() || ' ';
                    if (i > 0) pinyinLine += ' ';
                    if (i > 0 && currentLang === 'en') charLine += ' ';
                    pinyinLine += p;
                    charLine += c;
                }
            });
            const copyText = pinyinLine + '\n' + charLine;
            navigator.clipboard.writeText(copyText).then(() => {
                showToast(`✅ 已复制 ${sorted.length} 个`, 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = copyText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast(`✅ 已复制 ${sorted.length} 个`, 'success');
            });
        }

        // ============================================================
        //  TRANSLATE (unchanged)
        // ============================================================
        function autoTranslate(text) {
            if (!text || text.length === 0) {
                document.getElementById('directTrans').textContent = '等待翻译…';
                document.getElementById('freeTransMain').textContent = '等待翻译…';
                document.getElementById('refGlobal').classList.remove('open');
                document.getElementById('refBodyGlobal').innerHTML = '';
                document.getElementById('refBodyGlobal').classList.remove('show');
                return;
            }

            let directParts = [];
            const chars = [...text];
            let i = 0;
            while (i < chars.length) {
                const ch = chars[i];
                if (isPunct(ch)) {
                    directParts.push(ch);
                    i++;
                    continue;
                }
                let matchedWord = null;
                let matchedLen = 1;
                for (const w of dataStore.wordList) {
                    if (text.substring(i).startsWith(w.word) && w.word.length > matchedLen) {
                        matchedWord = w;
                        matchedLen = w.word.length;
                    }
                }
                if (matchedWord) {
                    directParts.push(matchedWord.meaning || matchedWord.word);
                    i += matchedLen;
                } else {
                    let meaning = null;
                    for (const w of dataStore.wordList) {
                        if (w.word === ch && w.meaning) {
                            meaning = w.meaning;
                            break;
                        }
                    }
                    if (meaning) {
                        directParts.push(meaning);
                    } else {
                        directParts.push(ch);
                    }
                    i++;
                }
            }
            const directText = directParts.join('');

            let freeText = directText;
            const freeRules = [
                { from: /一群人/g, to: '大家' },
                { from: /一些人/g, to: '有些人' },
                { from: /那些人/g, to: '那些人' },
                { from: /这一些/g, to: '这些' },
                { from: /那一些/g, to: '那些' },
                { from: /曹人/g, to: '大家' },
                { from: /曹物/g, to: '这些东西' },
                { from: /曹字/g, to: '这些字' },
                { from: /曹/g, to: '一些' },
                { from: /者其/g, to: '这个' },
                { from: /者曹/g, to: '这些' },
                { from: /者畔/g, to: '这边' },
                { from: /者/g, to: '这' },
                { from: /之其/g, to: '这个' },
                { from: /之曹/g, to: '这些' },
                { from: /之畔/g, to: '这边' },
                { from: /乎/g, to: '吧' },
                { from: /侬者/g, to: '我们这里' },
                { from: /侬/g, to: '我们' },
                { from: /毋是/g, to: '不是' },
                { from: /毋/g, to: '不' },
                { from: /莫/g, to: '不要' },
                { from: /岂/g, to: '这么' },
                { from: /可济/g, to: '很多' },
                { from: /无微/g, to: '没什么' },
                { from: /弗/g, to: '不会' },
                { from: /未/g, to: '还没' },
                { from: /爱/g, to: '想要' },
            ];
            for (const rule of freeRules) {
                freeText = freeText.replace(rule.from, rule.to);
            }
            freeText = freeText.replace(/的的/g, '的');
            freeText = freeText.replace(/[（）【】]/g, '');
            freeText = freeText.replace(/，+/g, '，');
            freeText = freeText.replace(/。+/g, '。');
            if (freeText === directText) {
                freeText = '（整理后）' + freeText;
            }

            let refText = '';
            let matchedSentence = null;
            for (const s of dataStore.sentences) {
                if (s.text && (text.includes(s.text) || s.text.includes(text))) {
                    matchedSentence = s;
                    break;
                }
            }
            if (matchedSentence) {
                refText = `📌 参考译文\n原文：${matchedSentence.text}\n发音：${matchedSentence.pinyin}\n译文：${matchedSentence.translation}`;
                if (matchedSentence.time) refText += `\n⏱ ${matchedSentence.time}`;
                if (matchedSentence.speaker) refText += `\n🗣 ${matchedSentence.speaker}`;
                if (matchedSentence.videoLink) {
                    refText += `\n🔗 <a href="${matchedSentence.videoLink}" target="_blank" style="color:#2563eb;text-decoration:underline;">跳转视频</a>`;
                }
            } else {
                refText = '（无匹配例句）';
            }

            document.getElementById('directTrans').textContent = directText;
            document.getElementById('freeTransMain').textContent = freeText;

            const refGlobal = document.getElementById('refGlobal');
            const refBody = document.getElementById('refBodyGlobal');
            if (matchedSentence) {
                refGlobal.classList.add('open');
                refBody.innerHTML = refText.replace(/\n/g, '<br>');
                refBody.classList.add('show');
                const toggleBtn = document.querySelector('.ref-global .ref-toggle-btn');
                if (toggleBtn) {
                    toggleBtn.querySelector('.arrow').classList.add('open');
                    toggleBtn.querySelector('span:first-child').textContent = '📖 收起参考';
                }
            } else {
                refGlobal.classList.remove('open');
                refBody.innerHTML = '';
                refBody.classList.remove('show');
                const toggleBtn = document.querySelector('.ref-global .ref-toggle-btn');
                if (toggleBtn) {
                    toggleBtn.querySelector('.arrow').classList.remove('open');
                    toggleBtn.querySelector('span:first-child').textContent = '📖 查看参考译文';
                }
            }
        }

        function toggleRefContent(el) {
            const arrow = el.querySelector('.arrow');
            const body = document.getElementById('refBodyGlobal');
            const global = document.getElementById('refGlobal');
            if (body) {
                const isOpen = body.classList.contains('show');
                if (isOpen) {
                    body.classList.remove('show');
                    arrow.classList.remove('open');
                    el.querySelector('span:first-child').textContent = '📖 查看参考译文';
                    if (!body.innerHTML.trim() || body.innerHTML.trim() === '（无匹配例句）') {
                        global.classList.remove('open');
                    }
                } else {
                    body.classList.add('show');
                    arrow.classList.add('open');
                    el.querySelector('span:first-child').textContent = '📖 收起参考';
                    if (!global.classList.contains('open')) {
                        global.classList.add('open');
                    }
                }
            }
        }

        function doTranslate() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) { showToast('请输入文字', 'warning'); return; }
            autoTranslate(text);
            showToast('翻译完成', 'success');
        }

        // ============================================================
        //  SEARCH (unchanged)
        // ============================================================
        function doSearch() {
            const input = document.getElementById('searchInput');
            const type = document.getElementById('searchType').value;
            const query = input.value.trim().toLowerCase();
            const resultsContainer = document.getElementById('searchResults');

            if (!query) {
                resultsContainer.innerHTML = '<div class="empty-result">输入关键词开始检索</div>';
                document.getElementById('resultCount').textContent = '0 结果';
                document.getElementById('searchPagination').style.display = 'none';
                return;
            }

            const isPinyin = /[0-9]/.test(query);
            let items = [];

            if (type === 'all' || type === 'char' || type === 'radical' || type === 'body') {
                for (const [ch, pinyins] of Object.entries(dataStore.charPinyinMap)) {
                    const info = dataStore.charInfoMap[ch] || {};
                    const wordsStr = (info.words || []).join(' ');
                    const examplesStr = (info.examples || []).join(' ');
                    const note = info.note || '';
                    const traditional = info.traditional || '';
                    const radical = info.radical || '';
                    const body = info.body || '';

                    let matched = false;
                    let matchType = '常用字';
                    let matchScore = 0;

                    if (isPinyin) {
                        if (pinyins.some(p => p === query)) {
                            matched = true;
                            matchType = '拼音匹配';
                            matchScore = 1;
                        }
                    } else {
                        const combined = `${ch} ${pinyins.join(' ')} ${wordsStr} ${examplesStr} ${note} ${traditional} ${radical} ${body}`.toLowerCase();
                        if (combined.includes(query)) {
                            matched = true;
                            matchScore = combined.indexOf(query);
                        }
                        if (type === 'radical' && !radical.toLowerCase().includes(query)) matched = false;
                        if (type === 'body' && !body.toLowerCase().includes(query)) matched = false;
                    }

                    if (matched) {
                        items.push({
                            type: matchType,
                            char: ch,
                            pinyin: pinyins.join('，'),
                            words: (info.words || []).join('、'),
                            note: note,
                            traditional: traditional,
                            radical: radical,
                            body: body,
                            score: matchScore,
                            link: `多语言学习卡.html?search=${encodeURIComponent(ch)}`
                        });
                    }
                }
            }

            if (type === 'all' || type === 'word') {
                dataStore.wordList.forEach(w => {
                    let matched = false;
                    let matchType = '高频词汇';
                    let matchScore = 0;
                    const combined = `${w.word} ${w.pinyin || ''} ${w.meaning || ''} ${w.pos || ''}`.toLowerCase();

                    if (isPinyin) {
                        const pinyins = (w.pinyin || '').split(/\s+/);
                        if (pinyins.some(p => p === query)) {
                            matched = true;
                            matchScore = 1;
                        }
                    } else {
                        if (combined.includes(query)) {
                            matched = true;
                            matchScore = combined.indexOf(query);
                        }
                    }

                    if (matched) {
                        const exists = items.some(item => item.char === w.word);
                        if (!exists) {
                            items.push({
                                type: matchType,
                                char: w.word,
                                pinyin: w.pinyin || '',
                                meaning: w.meaning || '',
                                pos: w.pos || '',
                                traditional: getTraditional(w.word),
                                radical: getRadical(w.word),
                                body: getBody(w.word),
                                score: matchScore,
                                link: `多语言学习卡.html?search=${encodeURIComponent(w.word)}`
                            });
                        }
                    }
                });
            }

            if (type === 'all' || type === 'sentence') {
                dataStore.sentences.forEach(s => {
                    const text = s.text || '';
                    const pinyin = s.pinyin || '';
                    const translation = s.translation || '';
                    const time = s.time || '';
                    const speaker = s.speaker || '';
                    const videoLink = s.videoLink || null;

                    let matched = false;
                    let matchScore = 0;
                    if (!isPinyin) {
                        const combined = `${text} ${pinyin} ${translation} ${time} ${speaker}`.toLowerCase();
                        if (combined.includes(query)) {
                            matched = true;
                            matchScore = combined.indexOf(query);
                        }
                    }

                    if (matched) {
                        items.push({
                            type: '句子',
                            text: text,
                            pinyin: pinyin,
                            translation: translation,
                            time: time,
                            speaker: speaker,
                            videoLink: videoLink,
                            score: matchScore,
                            link: videoLink || null
                        });
                    }
                });
            }

            items.sort((a, b) => {
                if (a.type === '拼音匹配' && b.type !== '拼音匹配') return -1;
                if (b.type === '拼音匹配' && a.type !== '拼音匹配') return 1;
                return (a.score || 0) - (b.score || 0);
            });

            const seen = new Set();
            items = items.filter(item => {
                const key = item.char || item.text || '';
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            searchResults = items;
            searchPage = 1;
            displaySearchResults();

            document.getElementById('resultCount').textContent = items.length + ' 结果';
            const totalPages = Math.ceil(items.length / searchPageSize);
            if (totalPages > 1) {
                document.getElementById('searchPagination').style.display = 'flex';
                document.getElementById('searchTotalInfo').textContent = `共 ${items.length} 条`;
            } else {
                document.getElementById('searchPagination').style.display = 'none';
            }
            updatePaginationInfo();
        }

        function displaySearchResults() {
            const resultsContainer = document.getElementById('searchResults');
            const start = (searchPage - 1) * searchPageSize;
            const end = Math.min(start + searchPageSize, searchResults.length);
            const pageItems = searchResults.slice(start, end);

            if (pageItems.length === 0) {
                resultsContainer.innerHTML = '<div class="empty-result">没有更多结果</div>';
                return;
            }

            let html = '';
            pageItems.forEach(item => {
                const trad = item.traditional ? ` (${item.traditional})` : '';
                const tag = item.type || '常用字';
                let detailHtml = '';

                if (item.type === '句子') {
                    const timeLabel = item.time ? '⏱ ' + item.time : '';
                    const speakerLabel = item.speaker ? '🗣 ' + item.speaker : '';
                    const videoBtn = item.videoLink ?
                        `<button class="link-btn" onclick="event.stopPropagation(); window.open('${item.videoLink}','_blank')">▶ 跳转视频</button>` :
                        '';
                    const clickAttr = item.videoLink ? `onclick="window.open('${item.videoLink}','_blank')"` : '';
                    detailHtml = `
                        <div class="pinyin-line">${item.pinyin}</div>
                        <div style="font-size:0.8rem;color:#5a4a3a;">${item.translation}</div>
                        <div class="meta">
                            <span class="tag">句子</span>
                            ${timeLabel} ${speakerLabel}
                            ${videoBtn}
                        </div>
                    `;
                    html += `<div class="result-item" ${clickAttr}>
                                <div><span class="highlight">${item.text}</span>${trad}</div>
                                ${detailHtml}
                            </div>`;
                } else {
                    const nearGroup = getNearGroupByChar(item.char);
                    let nearHtml = '';
                    if (nearGroup && nearGroup.length > 1) {
                        const others = nearGroup.filter(c => c !== item.char);
                        nearHtml = `形近：${others.join('、')}`;
                    }
                    const link = item.link || `多语言学习卡.html?search=${encodeURIComponent(item.char)}`;
                    let extraInfo = '';
                    if (item.meaning) extraInfo += '· ' + item.meaning + ' ';
                    if (item.words) extraInfo += '· ' + item.words + ' ';
                    if (item.note) extraInfo += '📌 ' + item.note;
                    if (item.pos) extraInfo += '· ' + item.pos;

                    detailHtml = `
                        <div style="font-size:0.8rem;color:#5a4a3a;">${extraInfo}</div>
                        ${nearHtml ? '<div style="font-size:0.75rem;color:#8a7a6a;">'+nearHtml+'</div>' : ''}
                        <div class="meta">
                            <span class="tag">${tag}</span>
                            ${item.radical ? '<span class="tag">部首：'+item.radical+'</span>' : ''}
                            ${item.body ? '<span class="tag">主体：'+item.body+'</span>' : ''}
                            <button class="link-btn" onclick="event.stopPropagation(); window.open('${link}','_blank')">📚 学习卡</button>
                        </div>
                    `;
                    html += `<div class="result-item" onclick="window.open('${link}','_blank')">
                                <div><span class="highlight">${item.char}</span>${trad}  ${item.pinyin}</div>
                                ${detailHtml}
                            </div>`;
                }
            });
            resultsContainer.innerHTML = html;
        }

        function updatePaginationInfo() {
            const total = searchResults.length;
            const totalPages = Math.ceil(total / searchPageSize);
            document.getElementById('searchPageInfo').textContent = `${searchPage} / ${totalPages || 1}`;
            document.getElementById('searchPrev').disabled = (searchPage <= 1);
            document.getElementById('searchNext').disabled = (searchPage >= totalPages);
        }

        function goSearchPage(delta) {
            const totalPages = Math.ceil(searchResults.length / searchPageSize);
            const newPage = searchPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            searchPage = newPage;
            displaySearchResults();
            updatePaginationInfo();
            document.getElementById('searchResults').scrollTop = 0;
        }

        // ============================================================
        //  IMPORT / EXPORT (unchanged)
        // ============================================================
        function importFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let workbook = null;
                    if (ext === 'xlsx') {
                        const data = new Uint8Array(e.target.result);
                        workbook = XLSX.read(data, { type: 'array' });
                    } else if (ext === 'json') {
                        const json = JSON.parse(e.target.result);
                        if (Array.isArray(json)) {
                            json.forEach(item => {
                                const ch = item.char || '';
                                const pinyins = item.pinyins ? item.pinyins.split(/[,，、\s]+/).filter(s =>
                                    s) : [];
                                if (ch && pinyins.length > 0) {
                                    dataStore.charPinyinMap[ch] = pinyins;
                                    dataStore.charInfoMap[ch] = {
                                        words: item.words ? item.words.split(/[,，、\s]+/).filter(s =>
                                            s) : [],
                                        examples: item.examples ? item.examples.split(/[,，、\s]+/)
                                        .filter(s => s) : [],
                                        note: item.note || '',
                                        traditional: item.traditional || '',
                                        radical: item.radical || '',
                                        body: item.body || ''
                                    };
                                    if (item.body) {
                                        const bodies = item.body.split(',').map(b => b.trim()).filter(b => b);
                                        bodies.forEach(b => {
                                            if (!dataStore.nearGroups[b]) dataStore.nearGroups[b] = [];
                                            if (!dataStore.nearGroups[b].includes(ch)) {
                                                dataStore.nearGroups[b].push(ch);
                                            }
                                            dataStore.nearCharToGroup[ch] = b;
                                        });
                                    }
                                }
                            });
                            updateStats();
                            showToast('✅ JSON 字库导入成功', 'success');
                            renderPanel(currentText || '');
                            return;
                        } else {
                            showToast('JSON 格式不支持，请使用Excel', 'error');
                            return;
                        }
                    } else {
                        showToast('不支持的文件格式', 'error');
                        return;
                    }

                    if (workbook) {
                        loadDataFromExcel(workbook);
                    }
                } catch (err) {
                    showToast('导入失败：' + err.message, 'error');
                    console.error(err);
                }
            };
            if (file.name.endsWith('.xlsx')) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file);
            }
        }

        function exportExcel() {
            if (Object.keys(dataStore.charPinyinMap).length === 0 && dataStore.sentences.length === 0) {
                showToast('没有数据可以导出', 'warning');
                return;
            }

            try {
                const wb = XLSX.utils.book_new();

                const charData = [];
                for (const [ch, pinyins] of Object.entries(dataStore.charPinyinMap)) {
                    const info = dataStore.charInfoMap[ch] || {};
                    charData.push({
                        '常用字': ch,
                        '潮州话音标': pinyins.join('，'),
                        '词汇': (info.words || []).join('、'),
                        '例子': (info.examples || []).join('、'),
                        '备注': info.note || '',
                        '繁体字': info.traditional || '',
                        '部首': info.radical || '',
                        '主体': info.body || ''
                    });
                }
                const ws1 = XLSX.utils.json_to_sheet(charData);
                XLSX.utils.book_append_sheet(wb, ws1, '常用字');

                const vocabData = dataStore.wordList.map(w => ({
                    '词汇': w.word || '',
                    '发音': w.pinyin || '',
                    '词性大类': w.pos || '',
                    '含义': w.meaning || ''
                }));
                const ws2 = XLSX.utils.json_to_sheet(vocabData);
                XLSX.utils.book_append_sheet(wb, ws2, '高频词汇表');

                const sentData = dataStore.sentences.map(s => ({
                    '项目': s.project || '',
                    '时间轴': s.time || '',
                    '说话人': s.speaker || '',
                    '原文': s.text || '',
                    '发音': s.pinyin || '',
                    '译文': s.translation || ''
                }));
                const ws3 = XLSX.utils.json_to_sheet(sentData);
                XLSX.utils.book_append_sheet(wb, ws3, '转录文本');

                const videoData = Object.entries(dataStore.videoLinks).map(([name, link]) => ({
                    '项目名称': name,
                    '链接': link
                }));
                const ws4 = XLSX.utils.json_to_sheet(videoData);
                XLSX.utils.book_append_sheet(wb, ws4, '视频来源');

                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `语法分析_${new Date().toISOString().slice(0,10)}.xlsx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ Excel 导出成功', 'success');
            } catch (err) {
                showToast('导出 Excel 失败: ' + err.message, 'error');
                console.error(err);
            }
        }

        function exportJSON() {
            if (Object.keys(dataStore.charPinyinMap).length === 0 && dataStore.sentences.length === 0) {
                showToast('没有数据可以导出', 'warning');
                return;
            }

            try {
                const exportData = {
                    charPinyinMap: dataStore.charPinyinMap,
                    charInfoMap: dataStore.charInfoMap,
                    nearGroups: dataStore.nearGroups,
                    nearCharToGroup: dataStore.nearCharToGroup,
                    sentences: dataStore.sentences,
                    wordList: dataStore.wordList,
                    videoLinks: dataStore.videoLinks,
                    exportTime: new Date().toISOString()
                };
                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `语法分析_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ JSON 导出成功', 'success');
            } catch (err) {
                showToast('导出 JSON 失败: ' + err.message, 'error');
                console.error(err);
            }
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = 'info', duration = 2200) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px) scale(0.95)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 350);
            }, duration);
        }

        // ============================================================
        //  SWITCH LANG (autoload JSON)
        // ============================================================
        async function switchLang(lang) {
            currentLang = lang;
            document.getElementById('langSelect').value = lang;
            await loadDataForLang(lang);
            if (currentText) {
                renderPanel(currentText);
            } else {
                renderPanel('');
            }
            showToast('已切换到 ' + lang, 'info');
        }

        async function loadDataForLang(lang) {
            const url = `data/${lang}.json`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const jsonData = await response.json();

                dataStore.charPinyinMap = {};
                dataStore.charInfoMap = {};
                dataStore.nearGroups = {};
                dataStore.nearCharToGroup = {};
                dataStore.sentences = [];
                dataStore.wordList = [];
                dataStore.videoInfo = null;
                dataStore.videoLinks = {};

                if (jsonData.charPinyinMap) Object.assign(dataStore.charPinyinMap, jsonData.charPinyinMap);
                if (jsonData.charInfoMap) Object.assign(dataStore.charInfoMap, jsonData.charInfoMap);
                if (jsonData.nearGroups) Object.assign(dataStore.nearGroups, jsonData.nearGroups);
                if (jsonData.nearCharToGroup) Object.assign(dataStore.nearCharToGroup, jsonData.nearCharToGroup);
                if (jsonData.sentences) dataStore.sentences = jsonData.sentences.slice();
                if (jsonData.wordList) dataStore.wordList = jsonData.wordList.slice();
                if (jsonData.videoInfo) dataStore.videoInfo = jsonData.videoInfo;
                if (jsonData.videoLinks) Object.assign(dataStore.videoLinks, jsonData.videoLinks);

                updateStats();
                renderPanel(currentText || '');
                showToast(`✅ ${lang} 数据加载成功`, 'success');
            } catch (error) {
                console.error('加载语种数据失败:', error);
                showToast(`❌ 加载 ${lang} 数据失败，请检查网络或文件是否存在`, 'error');
            }
        }

        // ============================================================
        //  TOGGLE RIGHT PANEL
        // ============================================================
        let rightVisible = true;

        function toggleRightPanel() {
            rightVisible = !rightVisible;
            const panel = document.getElementById('panelRight');
            const left = document.getElementById('panelLeft');
            const btn = document.getElementById('btnToggleRight');
            if (rightVisible) {
                panel.classList.remove('hidden');
                panel.classList.add('expanded');
                left.classList.remove('expanded');
                btn.textContent = '🔍 隐藏检索';
                btn.classList.add('btn-accent');
                btn.classList.remove('btn-outline');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('expanded');
                left.classList.add('expanded');
                btn.textContent = '🔍 显示检索';
                btn.classList.remove('btn-accent');
                btn.classList.add('btn-outline');
            }
        }

        // ============================================================
        //  EVENT BINDINGS
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            const langSelect = document.getElementById('langSelect');
            currentLang = langSelect.value;

            await loadDataForLang(currentLang);

            langSelect.addEventListener('change', async (e) => {
                const lang = e.target.value;
                await switchLang(lang);
            });

            const input = document.getElementById('textInput');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    doPrint(); }
            });

            document.getElementById('btnPrint').addEventListener('click', doPrint);
            document.getElementById('btnClear').addEventListener('click', () => {
                document.getElementById('textInput').value = '';
                renderPanel('');
                input.focus();
                showToast('已清空', 'info');
            });

            document.getElementById('btnBackend').addEventListener('click', () => {
                document.getElementById('backendModal').classList.add('show');
            });
            document.getElementById('closeBackend').addEventListener('click', () => {
                document.getElementById('backendModal').classList.remove('show');
            });
            document.getElementById('backendModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) document.getElementById('backendModal').classList.remove('show');
            });

            document.getElementById('fileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) importFile(file);
                e.target.value = '';
            });
            document.getElementById('reloadHintBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });

            document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
            document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);

            document.getElementById('selectionMode').addEventListener('change', (e) => {
                selectionMode = e.target.checked;
                showToast(selectionMode ? '🎯 选择模式' : '🔊 退出选择模式', 'info');
            });
            document.getElementById('copySelected').addEventListener('click', copySelected);
            document.getElementById('clearSelection').addEventListener('click', clearSelection);
            document.getElementById('selectAll').addEventListener('click', selectAll);

            document.getElementById('btnTranslate').addEventListener('click', doTranslate);
            document.getElementById('btnTranslateClear').addEventListener('click', () => {
                document.getElementById('directTrans').textContent = '等待翻译…';
                document.getElementById('freeTransMain').textContent = '等待翻译…';
                document.getElementById('refGlobal').classList.remove('open');
                document.getElementById('refBodyGlobal').innerHTML = '';
                document.getElementById('refBodyGlobal').classList.remove('show');
                showToast('已清空翻译', 'info');
            });

            document.getElementById('btnSearch').addEventListener('click', doSearch);
            document.getElementById('searchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doSearch();
            });
            document.getElementById('searchType').addEventListener('change', doSearch);

            document.getElementById('searchPrev').addEventListener('click', () => goSearchPage(-1));
            document.getElementById('searchNext').addEventListener('click', () => goSearchPage(1));

            document.getElementById('btnToggleRight').addEventListener('click', toggleRightPanel);

            rightVisible = true;
            document.getElementById('panelRight').classList.remove('hidden');
            document.getElementById('panelRight').classList.add('expanded');
            document.getElementById('panelLeft').classList.remove('expanded');
            document.getElementById('btnToggleRight').textContent = '🔍 隐藏检索';
            document.getElementById('btnToggleRight').classList.add('btn-accent');
            document.getElementById('btnToggleRight').classList.remove('btn-outline');

            renderPanel('');
            updateStats();
            showToast('📂 已自动加载 ' + currentLang + ' 数据，可开始使用', 'info', 3000);
        });

        function doPrint() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) { showToast('请输入文字', 'warning');
                input.focus(); return; }
            renderPanel(text);
            clearSelection();
            const unitCount = currentLang === 'en' ? text.split(/\s+/).filter(w => w.length > 0).length : text.length;
            showToast('🖨️ 已排印 ' + unitCount + ' 个单元', 'success', 1500);
        }

        document.addEventListener('click', (e) => {
            if (activePopup && !activePopup.contains(e.target) && !e.target.closest('.char-cell')) {
                closePopup();
            }
        });
        window.addEventListener('resize', closePopup);
        window.addEventListener('scroll', closePopup);

        console.log('📜 语法分析 · 活字印刷 (v8 - 带自动加载)');
        console.log('✅ 切换语种自动加载对应 data/*.json 文件');
        console.log('✅ 手动导入功能仍可用作备用');
    </script>
</body>
</html>
