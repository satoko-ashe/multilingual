<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>语法分析 · 活字印刷 · 数据驱动</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap');

        body {
            font-family: 'Noto Serif SC', '华文楷体', 'KaiTi', serif;
            background: #f5efe4;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(210, 180, 140, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(210, 180, 140, 0.12) 0%, transparent 60%);
            min-height: 100vh;
            padding: 16px;
            color: #2c1810;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            max-width: 1440px;
            width: 100%;
            background: rgba(250, 245, 235, 0.72);
            backdrop-filter: blur(2px);
            border-radius: 40px 40px 32px 32px;
            padding: 24px 28px 28px;
            box-shadow: 0 24px 64px rgba(100, 70, 40, 0.20), inset 0 1px 0 rgba(255, 245, 230, 0.6);
            border: 1px solid rgba(200, 180, 160, 0.25);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(180, 150, 120, 0.18);
        }

        .title-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .main-title {
            font-family: 'Ma Shan Zheng', '华文行楷', cursive;
            font-size: 2.4rem;
            font-weight: 400;
            color: #8b3a2a;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0 rgba(180, 120, 80, 0.10);
            line-height: 1.2;
        }
        .main-title small {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.85rem;
            color: #a08070;
            letter-spacing: 1px;
            margin-left: 6px;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Noto Serif SC', serif;
            padding: 7px 18px;
            border: none;
            border-radius: 36px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #d4c5b0;
            color: #3d2a1a;
            box-shadow: 0 2px 8px rgba(100, 70, 40, 0.08);
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(100, 70, 40, 0.14);
        }
        .btn:active {
            transform: translateY(0px);
        }

        .btn-primary {
            background: #a67c5a;
            color: #fef6ed;
            box-shadow: 0 4px 12px rgba(140, 100, 70, 0.20);
        }
        .btn-primary:hover {
            background: #8f6a4a;
        }

        .btn-accent {
            background: #b8863a;
            color: #fef6ed;
            box-shadow: 0 4px 12px rgba(180, 130, 50, 0.20);
        }
        .btn-accent:hover {
            background: #a07430;
        }

        .btn-success {
            background: #5d8a6e;
            color: #fef6ed;
            box-shadow: 0 4px 12px rgba(60, 120, 80, 0.20);
        }
        .btn-success:hover {
            background: #4b765c;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #b8a090;
            color: #5a4030;
        }
        .btn-outline:hover {
            background: rgba(180, 150, 130, 0.08);
            border-color: #8a7060;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 0.8rem;
            border-radius: 24px;
        }
        .btn-xs {
            padding: 2px 10px;
            font-size: 0.7rem;
            border-radius: 20px;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 250, 240, 0.5);
            padding: 4px 14px 4px 18px;
            border-radius: 40px;
            border: 1px solid rgba(200, 180, 160, 0.12);
        }
        .lang-selector label {
            font-weight: 600;
            color: #5a4a3a;
            font-size: 0.85rem;
        }
        .lang-selector select {
            padding: 5px 12px 5px 8px;
            border-radius: 30px;
            border: 1px solid #d8cdc0;
            background: rgba(255, 250, 240, 0.7);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            color: #2c1810;
            outline: none;
            cursor: pointer;
        }
        .lang-selector select:focus {
            border-color: #b8863a;
            box-shadow: 0 0 0 3px rgba(184, 134, 58, 0.08);
        }

        /* ===== 上面板 ===== */
        .upper-panel {
            display: flex;
            gap: 16px;
            height: 62vh;
            min-height: 320px;
            margin-bottom: 12px;
        }

        .panel-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: rgba(240, 230, 215, 0.20);
            border-radius: 24px;
            border: 1px solid rgba(200, 180, 160, 0.10);
            padding: 14px 16px 12px;
            overflow: hidden;
            transition: flex 0.3s ease;
        }
        .panel-left.expanded {
            flex: 2;
        }
        .panel-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: rgba(240, 230, 215, 0.20);
            border-radius: 24px;
            border: 1px solid rgba(200, 180, 160, 0.10);
            padding: 14px 16px 12px;
            overflow: hidden;
            display: flex;
            transition: flex 0.3s ease;
        }
        .panel-right.hidden {
            display: none;
        }
        .panel-right.expanded {
            flex: 2;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .panel-header .panel-title {
            font-weight: 700;
            font-size: 1.0rem;
            color: #5a3a2a;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-header .panel-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            padding: 4px 2px 2px 2px;
            min-height: 0;
        }
        .panel-body::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .panel-body::-webkit-scrollbar-track {
            background: rgba(200, 180, 160, 0.06);
            border-radius: 4px;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: rgba(180, 150, 130, 0.20);
            border-radius: 4px;
        }

        /* ===== 活字网格 ===== */
        .type-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 2px 3px;
            user-select: text;
        }

        .pinyin-cell {
            background: linear-gradient(145deg, #e8d9c4, #d4c0a8);
            border-radius: 6px 6px 0 0;
            padding: 3px 0 1px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #7a5a3a;
            letter-spacing: 0.2px;
            line-height: 1.3;
            border-bottom: 1px solid rgba(120, 90, 60, 0.08);
            box-shadow: inset 0 2px 0 rgba(255, 240, 220, 0.4);
            min-height: 22px;
            transition: background 0.15s;
            cursor: default;
            word-break: keep-all;
            font-family: 'Noto Serif SC', '华文楷体', serif;
        }
        .pinyin-cell.empty-pinyin {
            color: transparent;
            background: linear-gradient(145deg, #e8e0d4, #d6cabc);
            box-shadow: inset 0 2px 0 rgba(255, 240, 220, 0.15);
        }
        .pinyin-cell.is-punct {
            background: linear-gradient(145deg, #e6dccf, #d6cabc);
            color: transparent;
            box-shadow: inset 0 2px 0 rgba(255, 240, 220, 0.10);
        }

        .char-cell {
            background: linear-gradient(145deg, #e8d9c4, #d4c0a8);
            border-radius: 0 0 6px 6px;
            padding: 0 0 4px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #2c1810;
            line-height: 1.2;
            border-top: 1px solid rgba(255, 240, 220, 0.35);
            box-shadow: inset 0 -2px 0 rgba(120, 90, 60, 0.10);
            min-height: 38px;
            transition: background 0.15s, box-shadow 0.2s;
            cursor: pointer;
            font-family: 'Noto Serif SC', '华文楷体', serif;
            position: relative;
            word-break: keep-all;
        }
        .char-cell.has-multiple::after {
            content: '▾';
            position: absolute;
            bottom: 0px;
            right: 3px;
            font-size: 0.4rem;
            color: #b08050;
            opacity: 0.6;
            pointer-events: none;
        }
        .char-cell.is-punct {
            background: linear-gradient(145deg, #e6dccf, #d6cabc);
            color: #5a4a3a;
            font-size: 1.3rem;
            box-shadow: inset 0 -1px 0 rgba(120, 90, 60, 0.04);
            cursor: default;
        }
        .char-cell.is-punct::after {
            display: none;
        }

        .pinyin-cell.selected,
        .char-cell.selected {
            background: linear-gradient(145deg, #f7e4c8, #e6cba8) !important;
            box-shadow: 0 0 0 3px #b8863a, inset 0 2px 0 rgba(255, 240, 220, 0.6) !important;
            transform: scale(1.02);
            z-index: 1;
            position: relative;
        }
        .pinyin-cell.selected {
            border-radius: 6px 6px 0 0;
        }
        .char-cell.selected {
            border-radius: 0 0 6px 6px;
        }

        .pinyin-cell.printing,
        .char-cell.printing {
            animation: printPop 0.25s ease forwards;
            opacity: 0;
            transform: scale(0.85);
        }
        @keyframes printPop {
            0% {
                opacity: 0;
                transform: scale(0.80) rotateZ(-1.2deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.02) rotateZ(0.2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateZ(0deg);
            }
        }

        /* ===== 拼音弹出 ===== */
        .pinyin-popup {
            position: fixed;
            z-index: 999;
            background: rgba(255, 250, 240, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 6px 2px;
            box-shadow: 0 16px 48px rgba(60, 40, 20, 0.28), 0 0 0 1px rgba(180, 150, 120, 0.15);
            min-width: 70px;
            display: none;
            flex-direction: column;
            gap: 2px;
            animation: popIn 0.16s ease;
        }
        .pinyin-popup.show {
            display: flex;
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .pinyin-popup .popup-item {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #3d2a1a;
            cursor: pointer;
            transition: all 0.12s;
            text-align: center;
            font-family: 'Noto Serif SC', serif;
            background: transparent;
            border: none;
        }
        .pinyin-popup .popup-item:hover {
            background: rgba(184, 134, 58, 0.14);
            color: #7a4a20;
        }
        .pinyin-popup .popup-item.active {
            background: rgba(184, 134, 58, 0.18);
            color: #8b5a2a;
        }
        .pinyin-popup .popup-item:not(:last-child) {
            border-bottom: 1px solid rgba(200, 180, 160, 0.12);
        }

        /* ===== 检索区 ===== */
        .search-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .search-box input {
            flex: 1;
            min-width: 120px;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1.5px solid #d8cdc0;
            background: rgba(255, 250, 240, 0.4);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            color: #2c1810;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: #b8863a;
            box-shadow: 0 0 0 4px rgba(184, 134, 58, 0.08);
        }
        .search-box select {
            padding: 8px 14px;
            border-radius: 30px;
            border: 1.5px solid #d8cdc0;
            background: rgba(255, 250, 240, 0.4);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.85rem;
            color: #2c1810;
            outline: none;
            cursor: pointer;
        }
        .search-box select:focus {
            border-color: #b8863a;
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
            padding: 2px 2px 6px 2px;
        }
        .search-results .result-item {
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(255, 250, 240, 0.25);
            margin-bottom: 5px;
            border-left: 3px solid rgba(184, 134, 58, 0.20);
            transition: background 0.15s;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .search-results .result-item:hover {
            background: rgba(255, 250, 240, 0.5);
        }
        .search-results .result-item .highlight {
            background: #f7e4c8;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: 700;
        }
        .search-results .result-item .meta {
            font-size: 0.7rem;
            color: #8a7a6a;
            margin-top: 2px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-results .result-item .meta .tag {
            background: rgba(180, 150, 130, 0.10);
            padding: 0 10px;
            border-radius: 12px;
            color: #6a5a4a;
        }
        .search-results .result-item .pinyin-line {
            font-size: 0.8rem;
            color: #7a5a3a;
            margin-top: 2px;
        }
        .search-results .empty-result {
            color: #b0a090;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }
        .search-results .result-item .link-btn {
            display: inline-block;
            margin-top: 3px;
            padding: 1px 10px;
            border-radius: 12px;
            background: rgba(184, 134, 58, 0.12);
            color: #8b5a2a;
            font-size: 0.7rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .search-results .result-item .link-btn:hover {
            background: rgba(184, 134, 58, 0.20);
        }

        /* 分页控件 */
        .pagination-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-shrink: 0;
            padding-top: 6px;
            flex-wrap: wrap;
        }
        .pagination-bar .btn {
            padding: 2px 12px;
            font-size: 0.75rem;
        }
        .pagination-bar .page-info {
            font-size: 0.8rem;
            color: #6a5a4a;
        }

        /* ===== 下面板 ===== */
        .lower-panel {
            height: auto;
            min-height: 160px;
            background: rgba(240, 230, 215, 0.15);
            border-radius: 24px;
            border: 1px solid rgba(200, 180, 160, 0.10);
            padding: 14px 18px 12px;
            display: flex;
            flex-direction: column;
            margin-top: 2px;
            overflow: visible;
        }

        .lower-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .lower-header .title {
            font-weight: 700;
            font-size: 1.0rem;
            color: #5a3a2a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lower-header .title .badge {
            font-weight: 400;
            font-size: 0.65rem;
            background: rgba(184, 134, 58, 0.10);
            padding: 2px 12px;
            border-radius: 20px;
            color: #7a5a4a;
        }

        .translate-area {
            flex: 1;
            display: flex;
            gap: 14px;
            min-height: 60px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .translate-col {
            flex: 1;
            min-width: 0;
            background: rgba(255, 250, 240, 0.20);
            border-radius: 16px;
            padding: 10px 14px;
            overflow-y: auto;
            border: 1px solid rgba(200, 180, 160, 0.06);
        }
        .translate-col .col-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8a7a6a;
            letter-spacing: 1px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .translate-col .col-content {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #2c1810;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 参考译文 — 向下展开，不遮挡 */
        .ref-global {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(180, 150, 120, 0.15);
            flex-shrink: 0;
        }
        .ref-global.open {
            display: block;
        }
        .ref-global .ref-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #8b5a2a;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(184, 134, 58, 0.06);
            transition: background 0.2s;
            user-select: none;
            margin-bottom: 4px;
        }
        .ref-global .ref-toggle-btn:hover {
            background: rgba(184, 134, 58, 0.12);
        }
        .ref-global .ref-toggle-btn .arrow {
            transition: transform 0.25s ease;
            display: inline-block;
        }
        .ref-global .ref-toggle-btn .arrow.open {
            transform: rotate(180deg);
        }
        .ref-global .ref-body {
            font-size: 0.85rem;
            line-height: 1.8;
            color: #4a3a2a;
            background: rgba(255, 250, 240, 0.5);
            border-radius: 10px;
            padding: 10px 14px;
            border-left: 3px solid #b8863a;
            margin-top: 4px;
            display: none;
        }
        .ref-global .ref-body.show {
            display: block;
        }

        /* ===== 数据管理 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(30, 20, 10, 0.45);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal-box {
            background: #faf5ec;
            border-radius: 28px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(30, 20, 10, 0.30);
            border: 1px solid rgba(200, 180, 160, 0.15);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px 12px;
            border-bottom: 1px solid rgba(200, 180, 160, 0.12);
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.6rem;
            font-weight: 400;
            color: #5a3a2a;
            letter-spacing: 1px;
        }
        .modal-header .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(180, 150, 130, 0.08);
            font-size: 1.3rem;
            cursor: pointer;
            color: #6a5040;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-header .close-btn:hover {
            background: rgba(180, 150, 130, 0.18);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 16px 24px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: rgba(200, 180, 160, 0.04);
            border-radius: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(180, 150, 130, 0.15);
            border-radius: 4px;
        }

        .data-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 12px;
            padding: 8px 14px;
            background: rgba(240, 230, 215, 0.15);
            border-radius: 14px;
            border: 1px solid rgba(200, 180, 160, 0.08);
        }
        .data-toolbar .btn {
            padding: 4px 14px;
            font-size: 0.8rem;
        }
        .data-toolbar .file-label {
            position: relative;
            cursor: pointer;
        }
        .data-toolbar .file-label input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
